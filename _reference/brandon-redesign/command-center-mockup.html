<title>Command Center Redesign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* ── Tokens ported from the live Command Center stylesheet (index-CfHRXLy_.css) ── */
:root{
  --bg:hsl(210 33% 98%); --bg-2:hsl(210 33% 96%); --fg:hsl(215 40% 12%);
  --card:hsl(0 0% 100%); --card-fg:hsl(215 40% 12%);
  --muted:hsl(215 25% 94%); --muted-fg:hsl(215 16% 45%); --muted-fg-2:hsl(215 16% 60%);
  --border:hsl(215 25% 88%); --input:hsl(215 25% 90%);
  --primary:hsl(217 91% 50%); --primary-fg:#fff; --primary-10:hsl(217 91% 50% / .10); --primary-20:hsl(217 91% 50% / .2);
  --accent:hsl(199 89% 48%);
  --success:hsl(152 68% 38%); --warning:hsl(38 92% 50%); --destructive:hsl(0 75% 55%); --escalate:hsl(280 70% 55%);
  --navy-1:hsl(215 55% 18%); --navy-2:hsl(215 60% 12%); --navy-fg:hsl(210 40% 98%);
  --sb-bg:hsl(215 60% 13%); --sb-fg:hsl(210 40% 96%); --sb-border:hsl(215 50% 22%); --sb-accent:hsl(215 50% 20%);
  --mm-teal:#3f5c63; --mm-green:#2f9a7d; --mm-mint:#f3f8f7; --mm-rose:#c85a4d; --mm-rose-soft:#f8e6e3;
  --grad-primary:linear-gradient(135deg,var(--primary),var(--accent));
  --grad-navy:linear-gradient(180deg,var(--navy-1),var(--navy-2));
  --shadow-sm:0 1px 2px 0 hsl(215 40% 12% / .05); --shadow-md:0 4px 12px -2px hsl(215 40% 12% / .08); --shadow-lg:0 12px 32px -8px hsl(217 91% 50% / .18);
  --radius:.65rem;
  --amber-bg:hsl(38 92% 50% / .10); --amber-bd:hsl(38 92% 50% / .45); --amber-fg:hsl(30 80% 35%);
  --red-bg:hsl(0 75% 55% / .08); --red-bd:hsl(0 75% 55% / .35); --red-fg:hsl(0 65% 42%);
  --green-bg:hsl(152 68% 38% / .10); --green-fg:hsl(152 60% 30%);
  --blue-bg:hsl(217 91% 50% / .08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(215 50% 8%); --bg-2:hsl(215 50% 10%); --fg:hsl(210 33% 96%);
    --card:hsl(215 50% 11%); --card-fg:hsl(210 33% 96%);
    --muted:hsl(215 40% 16%); --muted-fg:hsl(215 20% 65%); --muted-fg-2:hsl(215 18% 52%);
    --border:hsl(215 40% 20%); --input:hsl(215 40% 20%);
    --primary:hsl(217 91% 60%); --primary-fg:hsl(215 50% 8%); --primary-10:hsl(217 91% 60% / .14); --primary-20:hsl(217 91% 60% / .25);
    --accent:hsl(199 89% 55%);
    --mm-mint:hsl(175 20% 14%); --mm-rose-soft:hsl(18 30% 16%);
    --amber-bg:hsl(38 92% 50% / .14); --amber-fg:hsl(38 90% 70%);
    --red-bg:hsl(0 75% 55% / .14); --red-fg:hsl(0 80% 72%);
    --green-bg:hsl(152 68% 38% / .16); --green-fg:hsl(152 60% 65%);
    --shadow-lg:0 12px 32px -8px hsl(0 0% 0% / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(215 50% 8%); --bg-2:hsl(215 50% 10%); --fg:hsl(210 33% 96%);
  --card:hsl(215 50% 11%); --card-fg:hsl(210 33% 96%);
  --muted:hsl(215 40% 16%); --muted-fg:hsl(215 20% 65%); --muted-fg-2:hsl(215 18% 52%);
  --border:hsl(215 40% 20%); --input:hsl(215 40% 20%);
  --primary:hsl(217 91% 60%); --primary-fg:hsl(215 50% 8%); --primary-10:hsl(217 91% 60% / .14); --primary-20:hsl(217 91% 60% / .25);
  --accent:hsl(199 89% 55%);
  --mm-mint:hsl(175 20% 14%); --mm-rose-soft:hsl(18 30% 16%);
  --amber-bg:hsl(38 92% 50% / .14); --amber-fg:hsl(38 90% 70%);
  --red-bg:hsl(0 75% 55% / .14); --red-fg:hsl(0 80% 72%);
  --green-bg:hsl(152 68% 38% / .16); --green-fg:hsl(152 60% 65%);
  --shadow-lg:0 12px 32px -8px hsl(0 0% 0% / .5);
  color-scheme:dark;
}
/* Optional accent themes the live app offers under the gear (Slate / Emerald / Violet / Rose / Amber) */
:root[data-accent="slate"]{--primary:hsl(220 14% 46%);--accent:hsl(220 18% 56%);--navy-1:hsl(220 18% 18%);--navy-2:hsl(220 20% 12%);--sb-bg:hsl(220 20% 13%);--sb-border:hsl(220 16% 22%);--sb-accent:hsl(220 16% 20%)}
:root[data-accent="emerald"]{--primary:hsl(160 84% 32%);--accent:hsl(172 66% 40%);--navy-1:hsl(168 35% 16%);--navy-2:hsl(168 40% 10%);--sb-bg:hsl(168 40% 11%);--sb-border:hsl(168 30% 20%);--sb-accent:hsl(168 30% 18%)}
:root[data-accent="violet"]{--primary:hsl(263 70% 55%);--accent:hsl(280 65% 55%);--navy-1:hsl(263 35% 18%);--navy-2:hsl(263 40% 12%);--sb-bg:hsl(263 35% 13%);--sb-border:hsl(263 28% 22%);--sb-accent:hsl(263 28% 20%)}
:root[data-accent="rose"]{--primary:hsl(347 77% 50%);--accent:hsl(330 65% 50%);--navy-1:hsl(345 30% 18%);--navy-2:hsl(345 35% 12%);--sb-bg:hsl(345 30% 13%);--sb-border:hsl(345 24% 22%);--sb-accent:hsl(345 24% 20%)}
:root[data-accent="amber"]{--primary:hsl(25 95% 48%);--accent:hsl(38 92% 50%);--navy-1:hsl(25 30% 18%);--navy-2:hsl(25 35% 12%);--sb-bg:hsl(25 30% 13%);--sb-border:hsl(25 24% 22%);--sb-accent:hsl(25 24% 20%)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Outfit,Inter,system-ui,sans-serif;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.15em}
.tn{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted-fg)}
.small{font-size:12px}.xs{font-size:11px}.xxs{font-size:10px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.hidden{display:none!important}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ── App frame ── */
#root{min-height:100%}
.screen{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg),var(--bg-2))}

/* Navy headers (dashboard aside header, tool page headers) */
.navy{background:var(--grad-navy);color:var(--navy-fg)}
.navy .dim{color:hsl(210 40% 98% / .6)}
.tile{width:36px;height:36px;border-radius:10px;background:hsl(0 0% 100% / .12);display:grid;place-items:center;flex-shrink:0}
.tile.grad{background:var(--grad-primary);box-shadow:var(--shadow-lg)}
.tile.lg{width:40px;height:40px}
.rc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid hsl(0 0% 100% / .15);background:hsl(0 0% 100% / .05);color:hsl(0 0% 100% / .7);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:500;max-width:100%}
.rc-chip .dot{width:6px;height:6px;border-radius:50%;background:hsl(0 0% 100% / .4)}
.rc-chip.green{border-color:hsl(152 68% 60% / .4);background:hsl(152 68% 60% / .15);color:hsl(152 70% 88%)}
.rc-chip.green .dot{background:hsl(152 68% 60%)}
.rc-chip.amber{border-color:hsl(38 92% 60% / .4);background:hsl(38 92% 60% / .15);color:hsl(38 90% 88%)}
.rc-chip.amber .dot{background:hsl(38 92% 60%)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid transparent;transition:opacity .15s,background .15s;white-space:nowrap}
.btn:hover{opacity:.92}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:6px;font-weight:500}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.slate{background:hsl(215 25% 27%);color:#fff}
.btn.white{background:#fff;color:var(--navy-2);box-shadow:var(--shadow-lg)}
.btn.outline{background:var(--card);border-color:var(--border);color:var(--fg)}
.btn.ghost{color:var(--muted-fg)}
.btn.ghost:hover{background:var(--muted);color:var(--fg);opacity:1}
.btn.teal{background:var(--mm-teal);color:#fff;box-shadow:var(--shadow-sm);padding:9px 16px}
.btn.green{background:hsl(160 84% 30%);color:#fff;box-shadow:var(--shadow-lg)}
.btn.danger{background:hsl(0 72% 51%);color:#fff}
.btn.danger-outline{background:var(--card);border-color:hsl(0 75% 55% / .5);color:hsl(0 65% 45%)}
.btn.blue{background:hsl(217 91% 50%);color:#fff}
.btn.on-navy{background:hsl(0 0% 100% / .1);color:#fff;border-color:hsl(0 0% 100% / .12)}
.btn.on-navy.active,.btn.on-navy:hover{background:#fff;color:var(--navy-2);opacity:1}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:22px;padding:0 6px;border-radius:999px;background:hsl(0 0% 100% / .25);font-size:11px;font-weight:700}

/* Pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid transparent}
.pill.active{background:var(--green-bg);color:var(--green-fg);border-color:hsl(152 68% 38% / .3)}
.pill.amber{background:var(--amber-bg);color:var(--amber-fg);border-color:var(--amber-bd)}
.pill.red{background:var(--red-bg);color:var(--red-fg);border-color:var(--red-bd)}
.pill.grey{background:var(--muted);color:var(--muted-fg)}
.pill.blue{background:var(--blue-bg);color:var(--primary)}
.pill.navy{background:var(--navy-2);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:500;background:var(--muted);color:var(--fg)}
.chip.amber{background:var(--amber-bg);color:var(--amber-fg)}
.chip.red{background:var(--red-bg);color:var(--red-fg)}
.chip.green{background:var(--green-bg);color:var(--green-fg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)}
.card.pad{padding:18px 20px}
.card.top-teal{border-top:4px solid var(--mm-teal)}
.card.left-teal{border-left:4px solid var(--mm-teal)}
.card-title{font-size:15px;font-weight:600}
.facts{display:grid;gap:14px 24px}
.fact .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);font-weight:600;margin-bottom:3px}
.fact .v{font-size:13px;font-weight:500}
.fact .v.big{font-size:15px;font-weight:600}
.fact .v.good{color:var(--green-fg)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.input{width:100%;border:1px solid var(--input);background:var(--card);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--fg)}
.input.sm{padding:5px 8px;font-size:12px}
.input::placeholder{color:var(--muted-fg-2)}
.search{position:relative}
.search .i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted-fg-2)}
.search .input{padding-left:28px}
select.input{appearance:auto}
.notice{border-radius:10px;padding:10px 14px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.notice.amber{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber-fg)}
.notice.red{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red-fg)}
.notice.blue{background:var(--blue-bg);border:1px solid var(--primary-20);color:var(--fg)}
.notice.green{background:var(--green-bg);border:1px solid hsl(152 68% 38% / .3);color:var(--green-fg)}
.divider{height:1px;background:var(--border)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ── Dashboard (index) ── */
.dash{display:flex;min-height:100%;height:100%}
.aside{width:340px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.aside-hdr{padding:16px 20px;display:flex;gap:12px;align-items:center}
.aside-hdr h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.tabs2{display:flex;border-bottom:1px solid var(--border)}
.tabs2 button{flex:1;padding:12px 8px;font-size:13px;font-weight:500;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.active{color:var(--primary);border-bottom-color:var(--primary)}
.people{padding:16px;overflow-y:auto;flex:1}
.people .eyebrow{margin:0 4px 12px}
.person{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;text-align:left}
.person:hover{background:var(--muted)}
.person.sel{background:var(--primary-10);border-color:var(--primary-20);color:var(--primary);font-weight:500}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad-primary);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.avatar.lg{width:48px;height:48px;font-size:18px}
.person .sub{font-size:11px;color:var(--muted-fg)}
.aside-foot{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.aside-foot .link{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--muted-fg)}
.aside-foot .link:hover{background:var(--muted);color:var(--fg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.main-hdr{border-bottom:1px solid var(--border);background:var(--card);padding:20px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.main-hdr h2{font-size:18px;font-weight:600}
.main-body{padding:32px;flex:1}
.bars{max-width:1160px;display:flex;flex-direction:column;gap:12px}
.bar{width:100%;text-align:left;display:block}
.bar .lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:500}
.bar .lbl .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--muted);font-size:11px;font-weight:700;color:var(--muted-fg)}
.bar .track{position:relative;height:32px;border-radius:8px;background:hsl(215 25% 94% / .6);overflow:hidden}
:root[data-theme="dark"] .bar .track,.dark .bar .track{background:hsl(215 40% 16% / .6)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .8s ease-out}
.bar .track.done{background:hsl(152 68% 38% / .12)}
.bar .done-lbl{color:var(--green-fg);font-weight:600;font-size:12px}
.bar:hover .lbl{color:var(--primary)}
.adhoc{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:24px}
.adhoc .eyebrow{margin-bottom:2px}
.foot-note{display:flex;justify-content:space-between;gap:12px;padding-top:6px;font-size:11px;color:var(--muted-fg-2);max-width:1160px}
.empty-center{flex:1;display:grid;place-items:center;padding:32px;text-align:center}
.empty-center .big-tile{width:64px;height:64px;border-radius:16px;background:var(--primary-10);display:grid;place-items:center;color:var(--primary);margin:0 auto 16px}

/* Processor variant */
.proc-hdr{padding:16px 24px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg)}
.proc-main{padding:32px;max-width:1160px;margin:0 auto;width:100%}

/* ── Tool / stage page frame (left dark patient sidebar + navy header) ── */
.tool{display:flex;min-height:100%;height:100%;width:100%}
.psb{width:180px;flex-shrink:0;background:var(--sb-bg);color:var(--sb-fg);display:flex;flex-direction:column;border-right:1px solid var(--sb-border)}
.psb.wide{width:230px}
.psb-hdr{padding:10px 10px 8px;border-bottom:1px solid var(--sb-border)}
.psb-hdr .eyebrow{color:hsl(210 40% 96% / .5)}
.psb-hdr .t{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.psb .search .input{background:hsl(0 0% 100% / .08);border-color:hsl(0 0% 100% / .12);color:#fff;font-size:12px;padding:6px 8px 6px 26px}
.psb .search .input::placeholder{color:hsl(210 40% 96% / .45)}
.psb-list{overflow-y:auto;flex:1;padding:6px}
.psb-group{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:hsl(210 40% 96% / .5);padding:8px 8px 4px}
.psb-group.warn{color:hsl(38 92% 65%)}
.prow{width:100%;text-align:left;display:flex;gap:7px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:12px;line-height:1.3}
.prow:hover{background:hsl(0 0% 100% / .06)}
.prow.sel{background:hsl(0 0% 100% / .12)}
.prow .nm{font-weight:500;display:flex;align-items:center;gap:5px}
.prow .sub{font-size:10px;color:hsl(210 40% 96% / .55)}
.prow .sub.red{color:hsl(0 80% 72%)}
.prow .date{margin-left:auto;font-size:10px;color:hsl(210 40% 96% / .45)}
.prow .i{margin-top:2px;opacity:.75}
.prow .i.warn{color:hsl(0 80% 70%);opacity:1}
.tool-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.tool-hdr{padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--sb-border);flex-shrink:0}
.tool-hdr .eyebrow{color:hsl(210 40% 98% / .55)}
.tool-hdr h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tool-hdr .sub{font-size:12px;color:hsl(210 40% 98% / .7)}
.tool-hdr .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{padding:6px;border-radius:6px;color:hsl(0 0% 100% / .8);display:inline-grid;place-items:center}
.icon-btn:hover{background:hsl(0 0% 100% / .1)}
.tool-body{padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px;max-width:1500px;width:100%}
.seg{display:inline-flex;background:hsl(0 0% 100% / .1);padding:2px;border-radius:8px}
.seg button{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;color:hsl(0 0% 100% / .8)}
.seg button.active{background:#fff;color:var(--navy-2)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}

/* Patient header card */
.pt-card{border-top:4px solid var(--navy-2)}
.pt-name{font-size:24px;font-weight:700;letter-spacing:-.01em}
.pt-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted-fg)}
.phone-pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy-2);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.facts-box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--bg);display:grid;gap:12px 24px}
.step{border-left:4px solid var(--mm-green);}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--mm-mint);color:var(--mm-teal);display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid hsl(175 30% 80%)}
.step-t{font-size:17px;font-weight:600}
.segbtns{display:flex;gap:6px}
.segbtns button{flex:1;border:1px dashed var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-weight:500;color:var(--muted-fg);background:var(--card)}

<script>
/* ═══════════════════════ state + tiny router ═══════════════════════ */
const state = {
  viewAs: 'brandon',          // which signed-in person we are pretending to be (manager or processor)
  user: null,                 // selected team member on the manager dashboard
  accent: '',
  access: JSON.parse(JSON.stringify(PEOPLE)), // editable copy for the Access page
  inventoryFilter: 'All',
};
try { const s = JSON.parse(localStorage.getItem('cc-mock')||'{}'); if (s.viewAs) state.viewAs = s.viewAs; if (s.accent!=null) state.accent = s.accent; } catch(e){}
function persist(){ try { localStorage.setItem('cc-mock', JSON.stringify({viewAs:state.viewAs, accent:state.accent})); } catch(e){} }
const me = () => PEOPLE.find(p=>p.key===state.viewAs) || PEOPLE[4];
const isManager = () => !!me().manager;
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString();
function go(path, q={}){ const qs = Object.entries(q).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&'); location.hash = '#'+path+(qs?'?'+qs:''); }
function href(path, q={}){ const qs = Object.entries(q).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&'); return '#'+path+(qs?'?'+qs:''); }
function parseHash(){ const h = location.hash.replace(/^#/,'') || '/'; const [path, qs=''] = h.split('?'); const q = Object.fromEntries(new URLSearchParams(qs)); return {path: path||'/', q}; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ═══════════════════════ shared pieces ═══════════════════════ */
function rcChip(cls){ const p = me(); const s = p.answers ? (cls||'green') : 'grey';
  const label = s==='green' ? 'Connected — calls ring in this tab' : s==='amber' ? 'Calls ring in another tab' : 'Not connected for calls';
  return `<span class="rc-chip ${s}" title="RingCentral softphone status">${ic(s==='grey'?'phone':'phone')}<span class="dot"></span><span class="truncate">${label}</span>${ic('volume')}${s==='amber'?'<button class="btn xs on-navy" style="margin-left:4px">Use this tab</button>':''}</span>`; }

function navyHeader({eyebrow, title, sub, icon='steth', back='/', actions='', center='', seg=''}){
  return `<header class="navy tool-hdr">
    <button class="icon-btn" data-nav="${back}" title="Back">${ic('back','width:18px;height:18px')}</button>
    <span class="tile grad">${ic(icon,'width:20px;height:20px;color:#fff')}</span>
    <div class="grow" style="min-width:160px">
      <div class="eyebrow">${esc(eyebrow)}</div>
      <h1>${esc(title)}</h1>
      ${sub?`<div class="sub">${esc(sub)}</div>`:''}
    </div>
    ${center}
    <div class="actions">${seg}${actions}<button class="icon-btn" title="Report a technical issue or request a UI change" data-action="report">${ic('panel','width:16px;height:16px')}</button></div>
  </header>`;
}

function patientSidebar({eyebrow, title, count, groups, selId, param='patient', route, wide=false, placeholder='Search patients…'}){
  return `<aside class="psb${wide?' wide':''}">
    <div class="psb-hdr">
      <div class="eyebrow">${esc(eyebrow)}</div>
      <div class="t"><span>${esc(title)} (${fmt(count)})</span><button class="icon-btn" title="Refresh from Monday" style="padding:3px">${ic('refresh','width:13px;height:13px')}</button></div>
      <div class="search" style="margin-top:8px">${ic('search','width:12px;height:12px')}<input class="input" placeholder="${esc(placeholder)}" aria-label="Search patients"></div>
    </div>
    <div class="psb-list">
      ${groups.map(g=>`<div class="psb-group${g.warn?' warn':''}">${esc(g.label)}</div>${g.rows.map(r=>`<button class="prow${r.id===selId?' sel':''}" data-nav="${href(route,{[param]:r.id})}">${r.icon?ic(r.icon,r.iconCls?'':''):''}<span class="grow"><span class="nm">${esc(r.name)}${r.dotEsc?'<span class="dot" style="width:6px;height:6px;background:#f87171"></span>':''}</span><span class="sub${r.red?' red':''}">${esc(r.sub)}</span></span>${r.date?`<span class="date">${esc(r.date)}</span>`:''}</button>`).join('')}`).join('')}
    </div>
  </aside>`;
}

function patientHeaderCard(p, {facts=true}={}){
  return `<section class="card pad pt-card stack" style="gap:14px">
    <div class="row wrap" style="justify-content:space-between">
      <div>
        <div class="eyebrow">Patient</div>
        <div class="row wrap"><span class="pt-name">${esc(p.name)}</span><span class="pill active">${ic('checkc')} Active</span></div>
        <div class="pt-meta" style="margin-top:6px">DOB ${p.dob} · ${p.gender} <span class="phone-pill">${ic('phone')} ${p.phone}</span> <button class="btn outline xs">${ic('msg')} Text</button> <button class="btn outline xs">${ic('phone')} Calls</button></div>
      </div>
    </div>
    ${facts?`<div class="grid3">
      <div class="facts-box" style="grid-template-columns:1fr 1fr"><div class="fact"><div class="k">Request</div><div class="v big">${esc(p.product)}</div></div><div class="fact"><div class="k">Serving</div><div class="v big">${esc(p.product)}</div></div></div>
      <div class="facts-box" style="grid-template-columns:1fr 1fr"><div class="fact"><div class="k">Referral type</div><div class="v big">${esc(p.referralType)}</div></div><div class="fact"><div class="k">Referral source</div><div class="v big">${esc(p.referralSource)}</div></div></div>
      <div class="facts-box"><div class="fact"><div class="k">Primary insurance</div><div class="v big">${esc(p.primary)}</div></div></div>
    </div>
    <button class="row muted small" style="gap:6px">${ic('chev')} Show member info, address, devices &amp; doctor</button>`:''}
  </section>`;
}

function notesBlock(notes){
  return `<section class="card pad">
    <div class="section-h"><div class="row small" style="font-weight:600">${ic('msg')} NOTES</div><button class="btn ghost xs">Edit</button></div>
    <div class="notes">${notes.length?notes.map(n=>`<div class="note"><div class="who">${esc(n[0])}</div>${esc(n[1])}</div>`).join(''):'<div class="note muted"><i>No notes yet.</i></div>'}</div>
    <div class="row" style="margin-top:10px;align-items:flex-start"><textarea class="input grow" rows="2" placeholder="Add a note…"></textarea><button class="btn primary sm" disabled>+ Add</button></div>
  </section>`;
}

/* Role bars, exactly as the live dashboard draws them */
function barsFor(person, {managerMode=false}={}){
  const ids = person.roles;
  const barRoles = ROLES.filter(r=>ids.includes(r.id)&&!r.adhoc);
  const adhoc = ROLES.filter(r=>ids.includes(r.id)&&r.adhoc);
  const maxv = Math.max(...barRoles.map(r=>Math.sqrt(managerMode?r.esc:r.count)),1);
  const bars = barRoles.map((r,i)=>{
    const v = managerMode?r.esc:r.count; const pct = v>0?Math.max(Math.sqrt(v)/maxv*100,4):0;
    const target = r.id==='fax'?'/fax-inbox':(r.route?r.route:'');
    return `<button class="bar" ${target?`data-nav="${href(target)}"`:'title="Auth Denied has no page yet"'} ${target?'':'style="cursor:default"'}>
      <div class="lbl"><span class="row" style="gap:8px"><span class="n">${i+1}</span><span class="dot" style="background:${r.color}"></span>${esc(r.label)}${target?ic('ext','opacity:.35;width:12px;height:12px'):''}</span>
      ${r.snapshotNA?`<span class="muted xs">not in this snapshot</span>`:v===0?`<span class="done-lbl">🎉 Done!</span>`:`<span class="tn" style="font-weight:600">${fmt(v)}</span>`}</div>
      <div class="track${v===0&&!r.snapshotNA?' done':''}"><div class="fill" style="width:${pct}%;background:linear-gradient(90deg,${r.color},${r.color}bb)"></div></div>
    </button>`;
  }).join('');
  const ad = adhoc.length&&state.layout==='current'?`<div class="adhoc"><div class="eyebrow">Ad-hoc tasks</div>${adhoc.map(r=>`<button class="btn teal" data-nav="${href(r.route)}" title="Open ${esc(r.label)}">${ic('zap')} ${esc(r.label)} ${r.count>0?`<span class="count-badge tn">${fmt(r.count)}</span>`:''} ${ic('ext','opacity:.7;width:13px;height:13px')}</button>`).join('')}</div>`:'';
  const banner = managerMode?`<div class="notice ${barRoles.every(r=>r.esc===0)?'green':'red'}" style="margin-bottom:14px">${ic('alert')}<div><b>Escalated patients only</b><div class="xs">Bars show patients flagged for escalation in each role — not the full queue.</div></div></div>`:'';
  return `${banner}<div class="bars">${bars}</div>${ad}<div class="foot-note"><span class="row" style="gap:4px">${ic('zap')} Refreshes every 60s</span><span>${managerMode?"Click a bar to open that role's escalated patients":"Click a bar to open that role's dashboard"}</span></div>`;
}

function gearPopover(){
  const themes=[['','Default','#2563eb'],['slate','Slate','#64748b'],['emerald','Emerald','#059669'],['violet','Violet','#7c3aed'],['rose','Rose','#e11d48'],['amber','Amber','#ea580c']];
  return `<div style="position:relative"><button class="btn ghost sm" data-action="gear" title="Settings" style="padding:6px">${ic('gear','width:16px;height:16px')}</button>
  <div class="pop hidden" id="gearPop" style="left:0;bottom:36px"><div class="eyebrow">Theme</div>${themes.map(t=>`<button class="opt${state.accent===t[0]?' on':''}" data-action="accent" data-v="${t[0]}"><span class="swatch" style="background:${t[2]}"></span>${t[1]}</button>`).join('')}<div class="divider" style="margin:6px 0"></div><div class="xs muted" style="padding:0 4px 4px" title="${esc(me().email)}">${esc(me().email)}</div><button class="opt muted">${ic('logout')} Sign out</button></div></div>`;
}

/* ═══════════════════════ DASHBOARD ═══════════════════════ */
function viewDashboard(q){
  if(!isManager()) return viewProcessorHome();

/* ═══════════════════════ COMMUNICATIONS (RingCentral hub) ═══════════════════════ */

  const rail = q.rail||'text'; const sel = q.c!=null ? +q.c : null;
  let list='', detail='', profile='';

  const profileFor = p => !p ? emptyProfile : (p.id ? (shownPatient = p, embeddedProfile(p, q, base)) : `<div class="stack" style="padding:14px 16px;gap:6px"><b>${esc(p.name)}</b><div class="xs muted">${esc(p.phone||'')} · not matched to a patient yet</div><button class="btn outline xs" style="align-self:flex-start">${ic('user')} Match to a patient</button></div>`);
  if(rail==='text'){
    list = `<div class="clist-hdr"><div class="row" style="justify-content:space-between"><b class="small">Text <span class="muted xs">(${TEXTS.length})</span></b><span class="row"><button class="btn blue xs">${ic('pencil')} New</button><button class="btn ghost xs" title="Refresh">${ic('refresh')}</button></span></div><div class="search">${ic('search','width:12px;height:12px')}<input class="input sm" placeholder="Search texts…" aria-label="Search texts"></div><div class="row" style="justify-content:flex-end"><span class="pill blue">All</span><span class="xs muted">Unread</span></div></div>
      <div style="overflow-y:auto">${TEXTS.map((t,i)=>`<button class="conv${sel===i?' sel':''}" data-nav="${href(base,{tab:q.tab,rail,c:i})}">${t.unread?'<span class="unread"></span>':'<span style="width:8px"></span>'}<span class="grow"><div class="nm">${esc(t.p.name)}</div><div class="pv truncate">${esc(t.last)}</div></span><span class="t">${t.t}</span></button>`).join('')}</div>`;
    if(sel!=null){ const t=TEXTS[sel]; detail = `<div class="cdetail-hdr"><b>${esc(t.p.name)}</b><span class="xs muted">${t.p.phone}</span><span class="row" style="margin-left:auto"><button class="btn outline xs">${ic('phone')} Call</button><button class="btn ghost xs">Mark as unread</button></span></div>
      ${t.optedOut?`<div class="notice red" style="margin:12px 16px 0">${ic('alert')} <b>${esc(t.p.name)}</b>&nbsp;replied STOP and is opted out of texts. Call them instead — texting is blocked.</div>`:''}
      <div class="thread">${t.thread.map(m=>`<div class="msg ${m[0]}">${esc(m[1])}<div class="t">${m[2]}</div></div>`).join('')}</div>
      <div class="composer"><input class="input grow" placeholder="${t.optedOut?'Texting is blocked for this patient':'Write a text…'}" ${t.optedOut?'disabled':''} aria-label="Write a text"><button class="btn primary sm" ${t.optedOut?'disabled':''}>${ic('send')} Send</button></div>`; profile = profileFor(t.p); }
    else detail = `<div class="empty-pane"><div>${ic('search','width:28px;height:28px;opacity:.4')}<h3>Text details</h3><div>Pick a conversation on the left, or search for a patient.</div></div></div>`;
  } else if(rail==='phone'){
    list = `<div class="clist-hdr"><div class="row" style="justify-content:space-between"><b class="small">Phone <span class="muted xs">(${CALLS.length})</span></b><button class="btn ghost xs" title="Refresh">${ic('refresh')}</button></div><div class="search">${ic('search','width:12px;height:12px')}<input class="input sm" placeholder="Search calls by name or number…" aria-label="Search calls"></div><div class="row xs" style="justify-content:space-between"><span class="row" style="gap:6px"><span class="pill blue">Calls</span><span class="muted">Voicemail</span></span><span class="row" style="gap:6px"><span class="muted">Today</span><span class="pill blue">All</span><span class="muted">Missed</span></span></div></div>
      <div style="overflow-y:auto">${CALLS.map((c,i)=>`<button class="conv${sel===i?' sel':''}" data-nav="${href(base,{tab:q.tab,rail,c:i})}">${ic(c.dir==='in'?'phone':'send',c.missed?'color:#ef4444':'color:var(--muted-fg)')}<span class="grow"><div class="nm">${esc(c.p?c.p.name:c.who)}</div><div class="pv">${c.missed?'Missed · ':''}${esc(c.who)} · ${c.dur}</div></span><span class="t">${c.t}</span></button>`).join('')}
      <div class="psb-group" style="color:var(--muted-fg)">Voicemail (${VOICEMAILS.length})</div>${VOICEMAILS.map(v=>`<button class="conv">${v.heard?'<span style="width:8px"></span>':'<span class="unread"></span>'}<span class="grow"><div class="nm">${esc(v.p.name)}</div><div class="pv truncate">${esc(v.transcript)}</div></span><span class="t">${v.t}</span></button>`).join('')}</div>`;
    if(sel!=null){ const c=CALLS[sel]; detail=`<div class="cdetail-hdr"><b>${esc(c.p?c.p.name:'Unknown caller')}</b><span class="xs muted">${c.who} · ${c.t} · ${c.dur}</span><span class="row" style="margin-left:auto"><button class="btn outline xs">${ic('msg')} Text them back</button><button class="btn outline xs">${ic('phone')} Call</button></span></div>
      <div class="thread"><div class="card pad" style="padding:14px"><div class="row"><button class="btn outline xs">${ic('play')} Play recording</button><button class="btn ghost xs">${ic('download')} Download</button><span class="xs muted" style="margin-left:auto">${c.dur}</span></div>${c.rec?'<div class="small" style="margin-top:12px"><b>Transcript</b><p class="muted">Hi, this is '+esc(c.p?c.p.name.split(' ')[0]:'the patient')+' — I wanted to check whether my supplies shipped and if I need to send anything else for the insurance.</p></div>':'<div class="xs muted" style="margin-top:8px">No audio attached to this call.</div>'}</div></div>`; profile = profileFor(c.p); if(!c.p) profile = `<div class="stack" style="padding:14px 16px"><div class="notice amber xs">${ic('alert')} This number isn't on any pipeline board. You can still text and call it.</div><div class="xs muted">Calling from a different number? Find their profile:</div><div class="search">${ic('search','width:12px;height:12px')}<input class="input sm" placeholder="Find the patient by name or phone…" aria-label="Find the patient"></div></div>`; }
    else detail = `<div class="empty-pane"><div>${ic('search','width:28px;height:28px;opacity:.4')}<h3>Call details</h3><div>Pick a call to see the patient and text them back.</div></div></div>`;
  } else {
    list = `<div class="clist-hdr"><div class="row" style="justify-content:space-between"><b class="small">Fax <span class="muted xs">(${FAXES.length})</span></b><button class="btn ghost xs" title="Refresh">${ic('refresh')}</button></div><div class="search">${ic('search','width:12px;height:12px')}<input class="input sm" placeholder="Search faxes…" aria-label="Search faxes"></div><div class="row" style="justify-content:flex-end"><span class="pill blue">All ${ic('chev')}</span></div></div>
      <div style="overflow-y:auto">${FAXES.map((f,i)=>`<button class="conv${sel===i?' sel':''}" data-nav="${href(base,{tab:q.tab,rail,c:i})}">${f.read?'<span style="width:8px"></span>':'<span class="unread"></span>'}<span class="grow"><div class="nm">${esc(f.office)}</div><div class="pv">${f.number} · ${f.pages} pages</div></span><span class="t">${f.t.split(', ')[1]}</span></button>`).join('')}</div>`;
    if(sel!=null){ const f=FAXES[sel]; detail=`<div class="cdetail-hdr"><b>${esc(f.office)}</b><span class="xs muted">${f.number} · ${f.city} · ${f.pages} pages · ${f.t}</span><button class="btn outline xs" style="margin-left:auto">${ic('file')} View fax</button></div>
      <div class="thread"><div class="card pad" style="padding:14px"><div class="eyebrow" style="margin-bottom:6px">Sending office</div>${f.doc?`<b>${esc(f.doc.clinic)}</b><div class="small muted">${esc(f.doc.name)} · NPI ${f.doc.npi} · ${esc(f.doc.addr)}</div><div class="xs" style="color:var(--green-fg);margin-top:4px">${ic('checkc')} Matched in the MM Doctor Database</div>`:`<div class="small muted">This number isn't on any patient's doctor record or in the MM Doctor Database.</div>`}</div>
      ${f.doc?`<div class="card pad" style="padding:14px"><div class="eyebrow" style="margin-bottom:6px">Their active patients</div>${PATIENTS.filter(p=>p.doc===f.doc).slice(0,4).map(p=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--border)"><b>${esc(p.name)}</b><span class="muted">· ${p.product}</span><span class="chip amber" style="margin-left:auto">Chasing</span></div>`).join('')}</div>`:''}</div>`; profile = `<div class="empty-pane">${ic('print','width:26px;height:26px;opacity:.4')}<div class="xs" style="max-width:190px;margin-top:8px">Faxes are matched to a doctor's office. Their patients are listed in the middle.</div></div>`; }
    else detail = `<div class="empty-pane"><div>${ic('search','width:28px;height:28px;opacity:.4')}<h3>Fax details</h3><div>Pick a fax to see the sending office and their patients.</div></div></div>`;
  }
  if(!profile) profile = emptyProfile;
  return `<div class="comms">
    <div class="rail">${[['phone','Phone','phone'],['text','Text','msg'],['fax','Fax','print']].map(r=>`<button class="${rail===r[0]?'active':''}" data-nav="${href(base,{tab:q.tab,rail:r[0]})}">${ic(r[2],'width:16px;height:16px')}${r[1]}</button>`).join('')}</div>

  </div>`;

function pipelineChart({groupsOnly=null, title='Pipeline Overview', total=2389, tall=true}={}){
  const groups = PIPE.filter(g=>!groupsOnly||groupsOnly.includes(g.g));
  const max = Math.max(...groups.flatMap(g=>g.bars.map(b=>b[1].reduce((a,c)=>a+c,0))));
  const bars = groups.flatMap(g=>g.bars.map(b=>({g:g.g,label:b[0],vals:b[1],sum:b[1].reduce((a,c)=>a+c,0)})));
  return `<section class="card pad"><div class="row wrap" style="justify-content:space-between;margin-bottom:10px"><div class="row wrap"><button class="btn outline xs">${ic('sliders')} All Groups ${ic('chev')}</button><button class="btn outline xs" data-action="tools">${ic('zap')} Tools ${ic('chev')}</button><b class="small">${title}</b><span class="xs muted">| <b class="tn" style="color:var(--fg)">${fmt(total)}</b> patients</span></div><div class="legend">${BUCKETS.map(b=>`<span><span class="dot" style="background:${b[1]}"></span>${b[0]}</span>`).join('')}</div></div>
    <div class="pop hidden" id="toolsPop" style="left:110px;top:60px;width:270px"><div class="eyebrow">Accessibility tools</div>${[['Focus Mode','Simple solid bars, no color stacking. Reduces visual noise so you can scan counts at a glance.'],['Attention Needed <span class="chip red">240</span>','Highlights patients waiting 21+ days. 240 overdue right now.'],['Keyboard Navigation','Use arrow keys to move between bars. Enter to select. Numbers 1-5 jump to groups.']].map(t=>`<div style="padding:6px 8px"><div class="row" style="justify-content:space-between"><b class="xs">${t[0]}</b><span class="mgr-toggle xs">off</span></div><div class="xxs muted">${t[1]}</div></div>`).join('')}</div>
    <div class="scroll-x"><div style="min-width:${bars.length*62}px"><div class="chart" style="height:${tall?230:180}px">${bars.map(b=>`<div class="cbar" title="${esc(b.label)} · ${b.sum}"><div class="n tn">${fmt(b.sum)}</div><div class="stackv" style="height:${Math.max(4,Math.sqrt(b.sum)/Math.sqrt(max)*100)}%">${b.vals.map((v,i)=>v>0?`<div class="seg-v" style="flex:${v};background:${BUCKETS[i][1]}"></div>`:'').join('')}</div><div class="l">${esc(b.label)}</div></div>`).join('')}</div>
    <div class="groups-under">${groups.map(g=>`<div style="flex:${g.bars.length};color:var(--primary)">${esc(g.g)}</div>`).join('')}</div></div></div></section>`;
}

function dOff(days){ const d = new Date(2026,8,18); d.setDate(d.getDate()-days); return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`; }
function makeJourney(p, i){

        S('cleanup','Profile Clean-Up',[['Verified insurance', `${p.primary} · active`],['Member ID', p.memberId],['Doctor selected', `${p.doc.name} · ${p.doc.method}`],['Serving', p.product],['Sent off to', 'Medical Evaluation']],{route:'/stage/intakeCleanup'}),
      ] : [

    { ...MACRO[1], subs: [

        S('chase','Chase Clinicals',[['Attempts','3'],['Last attempt', ''],['Outcome','Office says end of week'],['Next attempt', ''],['Clinicals received','Not yet']],{route: fax?'/stage/chaseFax':'/stage/chaseParachute'}),

        S('submitAuth','Submit Auth',[['Auth required','Yes (pump + supplies)'],['Submitted via','Payer portal'],['Reference','AUTH-48211'],['Units requested','90 days']],{route:'/stage/submitAuth'}),
        S('authOutstanding','Auth Outstanding',[['Days outstanding','6'],['Last check', ''],['Payer says','In review'],['Auth ID','—'],['Start / end','—']],{route:'/stage/authOutstanding'}),
        S('authDenied','Auth Denied',[['Reason','Missing 90-day insulin log'],['Next step','Peer-to-peer requested'],['Resubmit by', '']],{route:'/stage/authDenied', cond:denied}),
        S('dvs','DVS (NY Medicaid)',[['Run','Automatic'],['Result','Approved · pump + supplies'],['DVS #','NY-DVS-77103']],{route:'/stage/dvs', cond:medicaid}),
      ]},
    { ...MACRO[3], subs: [
        S('welcomeCall','Welcome Call',[['Attempts','1'],['Reached','Yes · caregiver ok'],['Address confirmed', p.address],['Devices', `${p.pump!=='Not Serving'?p.pump:''}${p.pump!=='Not Serving'&&p.cgm!=='Not Serving'?' + ':''}${p.cgm!=='Not Serving'?p.cgm:''}`],['Infusion set', `${p.infusion} × 3`],['Place of service','Home']],{route:'/stage/welcomeCall'}),

}

/* ── global search ── */
const digits = s => String(s||'').replace(/\D/g,'');
function searchPatients(qraw){
  const q = qraw.trim().toLowerCase(); if (q.length < 2) return [];
  const qd = digits(q); const numeric = qd.length >= 3 && qd.length >= q.replace(/[\s\-().\/]/g,'').length - 1;
  const out = [];
  for (const p of PATIENTS) {
    let hit = null;
    if (numeric) {
      if (digits(p.phone).includes(qd)) hit = ['Phone', p.phone];
      else if (digits(p.dob).includes(qd) && qd.length>=4) hit = ['DOB', p.dob];
      else if (digits(p.memberId).includes(qd) && qd.length>=4) hit = ['Member ID', p.memberId];
      else if (digits(p.doc.phone).includes(qd)) hit = ['Doctor phone', `${p.doc.name} · ${p.doc.phone}`];
      else { const o = ordersFor(p).find(o => (o.cah||'').includes(qd) || (o.po||'').includes(qd) || (o.track && digits(o.track).includes(qd))); if (o) hit = (o.cah||'').includes(qd) ? ['Order #', o.cah] : (o.po||'').includes(qd) ? ['PO #', o.po] : ['Tracking', o.track]; }
    } else {
      if (p.name.toLowerCase().includes(q)) hit = ['Name', '', p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q)) ? 0 : 1];
      else if (p.memberId.toLowerCase().includes(q)) hit = ['Member ID', p.memberId];
      else if (p.doc.name.toLowerCase().includes(q) || p.doc.clinic.toLowerCase().includes(q)) hit = ['Doctor', p.doc.name];
      else if (p.primary.toLowerCase().includes(q)) hit = ['Insurance', p.primary];
    }
    if (hit) out.push({p, hit, rank: hit[2]!=null ? hit[2] : 1});
    if (out.length >= 40) break;
  }
  out.sort((a,b)=>a.rank-b.rank);
  return out.slice(0, 8);
}

/* ── Subscription · order card, confirmation-email style, one block per shipment.
   Monday holds one tracking number per order plus Cardinal's status / backorder fields; the mockup splits an order into
   "shipped" and "not yet shipped" from those. The live build gets per-line shipment status from Cardinal (handoff doc). ── */
const IN_STOCK_SETS = ['AutoSoft XC 6 mm 23"','AutoSoft XC 6 mm 32"','AutoSoft XC 6 mm 43"','AutoSoft 90 6 mm 23"','AutoSoft 90 9 mm 23"','AutoSoft 30 13 mm 43"','TruSteel 6 mm 23"','VariSoft 13 mm 23"'];
const isSetItem = i => /infusion|\bset\b|autosoft|trusteel|varisoft|contact/i.test((i.kind||'')+' '+(i.name||''));
function shipmentsOf(o){
  const items = (o.items&&o.items.length) ? o.items : [{kind:o.product||'Item', qty:o.qty||'', name:o.item||''}];
  if (o.shipments) return { items, shipments:o.shipments, unshipped:o.unshipped||[] };
  const norm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const bo = norm(o.backordered);
  const isBO = !!o.backorderQty || /backorder/i.test(o.flag||'') || /partially/i.test((o.api||'')+' '+(o.status||''));
  const hasShip = !!(o.track || o.shipped);
  if (!hasShip) return { items, shipments:[], unshipped: items.map(i => Object.assign({}, i, {why: isBO ? 'Backordered' : /hold/i.test(o.flag||'') ? 'Held at Cardinal' : /error/i.test(o.flag||'') ? 'Not booked yet' : 'Waiting on Cardinal'})) };
  let pending = [];
  if (isBO) { pending = items.filter(i => bo && norm(i.name).length>5 && bo.includes(norm(i.name))); if (!pending.length) pending = items.filter(isSetItem); if (pending.length===items.length) pending = items.length>1 ? items.slice(1) : []; }
  const inBox = items.filter(i => !pending.includes(i));
  return { items, shipments:[{ items:inBox, carrier:o.carrier, track:o.track, shipped:o.shipped, delivered:o.delivered, signedBy:o.signedBy, estShip:o.estShip }],
           unshipped: pending.map(i => Object.assign({}, i, {why:'Backordered'})) };
}
const isDDP = o => !o.cah && !o.api && !o.track && !o.shipped && !o.shipments;   // older orders placed through DDP — Cardinal never saw them
function orderCard(o, expanded, canAdjust){
  const kindIcon = k => /sensor/i.test(k) ? 'activity' : /pump/i.test(k) ? 'zap' : /cartridge/i.test(k) ? 'package' : /monitor|receiver|reader/i.test(k) ? 'panel' : 'swap';
  const S = shipmentsOf(o); const items = S.items;
  const err = /error/i.test(o.flag||'');
  const nShip = S.shipments.length, nDel = S.shipments.filter(x=>x.delivered).length;
  const pending = S.unshipped.length > 0;
  const allDelivered = nShip>0 && nDel===nShip && !pending;
  const partDelivered = pending && nDel>0;
  const partShipped = pending && nShip>0 && nDel===0;
  const total = nShip + (pending ? 1 : 0);
  const ddp = isDDP(o);
  const pill = ddp ? `<span class="pill grey">Ordered via DDP</span>`
    : allDelivered ? `<span class="pill active">${ic('check')} Delivered${o.delivered?' '+esc(o.delivered):''}</span>`
    : partDelivered ? `<span class="pill lightgreen">${ic('check')} Partially delivered · ${nDel} of ${total}</span>`
    : partShipped ? `<span class="pill lightgreen">${ic('check')} Partially shipped · ${nShip} of ${total}</span>`
    : o.flag && !/backorder/i.test(o.flag) ? `<span class="pill red">${esc(o.flag)}</span>`
    : pending && !nShip && /backorder/i.test(S.unshipped[0].why||'') ? `<span class="pill red">Backordered</span>`
    : nShip ? `<span class="pill blue">${ic('truck')} In transit</span>` : `<span class="pill amber">${esc(o.status||'In progress')}</span>`;
  const itemRow = (i, extra='', tile='') => `<div class="oi">${tile||`<span class="tile">${ic(kindIcon((i.kind||'')+' '+(i.name||'')),'width:18px;height:18px')}</span>`}<div class="grow"><b>${esc(i.name||i.kind)}</b><div class="xs muted">Quantity: ${esc(i.qty)}${i.kind&&i.name!==i.kind?` · ${esc(i.kind)}`:''}</div></div>${extra}</div>`;
  const compact = `<div class="ord ${o.complete?'done':'open'}"><div class="h"><b>${o.date||'—'}</b><span class="d">${esc(o.type||'')}${o.product?' · '+esc(o.product):''}</span>${pill}</div><div class="line"><span>${items.map(i=>`${i.qty} × <b>${esc(i.name||i.kind)}</b>`).join(' · ')}</span>${o.track?`<span>Tracking <b style="color:var(--primary)">${esc(o.track)}</b></span>`:''}</div></div>`;
  if (!expanded) return compact;
  const band = `<div class="oc-band"><div><div class="eyebrow">Order</div><b class="mono">${o.cah?'#'+esc(o.cah):ddp?'DDP':'#'+esc(o.id||'—')}</b></div><div><div class="eyebrow">Placed</div><b>${o.date||'—'}</b></div><div><div class="eyebrow">Type</div><b>${esc(o.type||'—')}${o.product?` <span class="muted" style="font-weight:400">· ${esc(o.product)}</span>`:''}</b></div>${o.po?`<div><div class="eyebrow">PO</div><b class="mono xs">${esc(o.po)}</b></div>`:''}<div style="margin-left:auto">${pill}</div></div>`;
  if (ddp) return `<div class="ord done oc" id="orderCard">${band}<div class="notice xs" style="background:var(--muted)">${ic('alert')} Ordered via DDP — no history available. Cardinal never handled this order, so there are no shipments, tracking or status to show.</div>${items.length&&items[0].name?`<div class="oitems">${items.map(i=>itemRow(i)).join('')}</div>`:''}</div>`;
  const shipBlock = (x, n) => { const st = x.delivered ? `<span class="pill active">${ic('check')} Delivered ${esc(x.delivered)}</span>` : x.shipped ? `<span class="pill blue">${ic('truck')} In transit · shipped ${esc(x.shipped)}</span>` : `<span class="pill amber">${ic('clock')} Ships ${esc(x.estShip||'soon')}</span>`;
    return `<div class="shp ${x.delivered?'dlv':x.shipped?'trn':'wait'}"><div class="shp-h"><b>${total>1?`Shipment ${n} of ${total}`:'Shipment'}</b>${st}<span class="xs muted">${x.carrier?esc(x.carrier):''}${x.track?` · <a href="#" class="trk" title="Opens the carrier's tracking page">${esc(x.track)}</a>`:''}${x.signedBy?` · signed ${esc(x.signedBy)}`:''}</span></div><div class="oitems">${x.items.map(i=>itemRow(i)).join('')||'<div class="xs muted">Cardinal didn\'t list the lines in this shipment.</div>'}</div></div>`; };
  // swap: everyone sees the button and the panel; only people with the Adjust orders ability can pick a set and confirm
  const swapKey = String(o.id); const swapOpen = state.swapOpen===swapKey; const sent = (state.swapSent||{})[swapKey];
  const swapTile = i => `<button class="tile swapbtn${swapOpen?' on':''}" data-action="swap" data-v="${swapKey}" data-item="${esc(i.name||'')}" title="Swap this set for one Cardinal can ship now">${ic('swap','width:16px;height:16px')}<span>Swap</span></button>`;
  const swapPanel = i => !(swapOpen && (!state.swapItem || state.swapItem===(i.name||''))) ? '' : `<div class="swap-panel${canAdjust?'':' locked'}"><div class="row wrap" style="gap:10px;align-items:flex-end"><label class="ef grow"><span class="k">Replace ${esc(i.name)} with</span><select class="input sm" id="swapTo" aria-label="Replacement infusion set" ${canAdjust?'':'disabled'}>${IN_STOCK_SETS.filter(x=>x!==i.name).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="ef" style="width:80px"><span class="k">Qty</span><input class="input sm" id="swapQty" type="number" min="1" value="${esc(i.qty||3)}" aria-label="Quantity" ${canAdjust?'':'disabled'}></label><label class="ef" style="min-width:180px"><span class="k">Why</span><select class="input sm" id="swapWhy" aria-label="Reason" ${canAdjust?'':'disabled'}><option>Backordered at Cardinal</option><option>Patient request</option><option>Prescription changed</option></select></label></div><div class="row wrap" style="gap:8px;margin-top:10px;align-items:center"><button class="btn primary sm${canAdjust?'':' perm-off'}" ${canAdjust?`data-action="swapsend" data-v="${swapKey}"`:'aria-disabled="true"'}>${ic('send')} Confirm swap — send to Cardinal</button><button class="btn ghost sm" data-action="swapcancel">Cancel</button>${canAdjust?'':`<span class="xs muted">Adjusting orders isn't enabled for ${esc(me().name)} — an admin can turn on <b>Adjust orders</b> in Users; until then this is read-only.</span>`}</div></div>`;
  // a swapped line: the mock's confirmed swap, or the board's Sub set / Sub status columns
  const swapped = sent ? { to: sent.to, from: sent.from||'', qty: sent.qty, note: 'sent to Cardinal just now' } : (o.subSet ? { to: o.subSet, from: '', qty: '', note: `${o.subStatus?esc(o.subStatus):'Sent'}${o.subCah?' · new Cardinal #'+esc(o.subCah):''}` } : null);
  const pendWhy = pending ? (S.unshipped[0].why||'Waiting on Cardinal') : '';
  const pendBO = /backorder/i.test(pendWhy);
  const pendingBlock = !pending ? '' : swapped
    ? `<div class="shp pend swapped"><div class="shp-h"><b>${nShip?`Shipment ${total} of ${total}`:'Not shipped yet'}</b><span class="pill amber">${ic('swap')} Swapped</span><span class="xs muted">${swapped.from||S.unshipped.find(isSetItem)?`swapped from ${esc(swapped.from||(S.unshipped.find(isSetItem)||{}).name||'')} · `:''}${swapped.note}</span></div><div class="oitems">${S.unshipped.map(i=>isSetItem(i) ? itemRow({kind:i.kind, qty: swapped.qty||i.qty, name: swapped.to}) : itemRow(i, `<span class="xs muted">${esc(i.why||'Waiting on Cardinal')}</span>`)).join('')}</div></div>`
    : `<div class="shp pend${pendBO?' bo':''}"><div class="shp-h"><b>${nShip?`Shipment ${total} of ${total}`:'Not shipped yet'}</b><span class="pill ${pendBO?'red':'amber'}">${ic(pendBO?'warn':'clock')} ${pendBO?'Backordered':esc(pendWhy)}</span><span class="xs muted">${nShip?'not shipped yet':''}${S.unshipped[0].eta?` · Cardinal ETA ${esc(S.unshipped[0].eta)}`:o.backorderQty?` · backordered qty ${esc(o.backorderQty)}`:''}</span></div><div class="oitems">${S.unshipped.map(i=>`${itemRow(i, isSetItem(i) ? '' : `<span class="xs muted">${esc(i.why||'Waiting on Cardinal')}</span>`, isSetItem(i) ? swapTile(i) : '')}${isSetItem(i)?swapPanel(i):''}`).join('')}</div></div>`;
  const steps = [['Created',o.date||''],['Placed',o.cah?'Cardinal #'+o.cah:(o.status||'')],['Accepted',err?'Booking error':o.flag&&/hold/i.test(o.flag)?'On hold':'Accepted'],
    [pending&&nShip?'Partially shipped':'Shipped', nShip?(pending?`${nShip} of ${total} shipments`:(o.shipped||S.shipments[0].shipped||'Shipped')):'Not yet'],
    [partDelivered?'Partially delivered':'Delivered', allDelivered?(o.delivered||S.shipments[0].delivered||''):(nDel?`${nDel} of ${total}`:'')]];
  const done = allDelivered||partDelivered ? 5 : nShip ? 4 : /accepted|shipped|partially/i.test((o.status||'')+(o.api||'')) ? 3 : o.flag ? (/hold|error/i.test(o.flag)?2:3) : 2;
  const partAt = k => (k===3 && pending && nShip) || (k===4 && partDelivered);
  return `<div class="ord ${o.complete?'done':'open'} oc ${allDelivered?'delivered':''}" id="orderCard">
    ${band}
    ${o.flag&&!/backorder/i.test(o.flag)&&!allDelivered?`<div class="notice red xs">${ic('warn')} ${esc(o.flag)}${o.apiMsg && !o.flag.includes(o.apiMsg.slice(0,40))?' — '+esc(o.apiMsg):''}</div>`:''}
    ${!o.complete&&/substitution/i.test((o.api||'')+(o.status||''))?`<div class="notice amber xs">${ic('swap')} Cardinal needs a substitution — the ordered set isn't available. Pick a replacement below.</div>`:''}
    <div class="shipments">${S.shipments.map((x,k)=>shipBlock(x,k+1)).join('')}${pendingBlock}</div>
    ${o.shipTo?`<div class="line xs"><span class="muted">Ship to</span><span>${esc(o.shipTo)}</span></div>`:''}
    <div class="tracker${allDelivered?' delivered':''}">${steps.map((st,k)=>{const e=err&&k===2; const cls = k<done ? (e?'err':(k===done-1?'done now':'done')) + (partAt(k)?' part':'') : ''; return `<div class="st ${cls}"><div class="c">${k<done?(e?ic('alert'):ic('check')):''}</div><div class="t">${st[0]}</div><div class="s">${esc(st[1])}</div></div>`;}).join('')}</div>
    ${o.lastSync?`<div class="line xs muted"><span>Last updated ${esc(o.lastSync)} · Cardinal sync</span></div>`:''}
  </div>`;
}
const parseUS = s => { const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s||''); return m ? new Date(+m[3],+m[1]-1,+m[2]) : null; };
const money = n => n==null ? '—' : '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});

/* ── Reorder (resupply) form — the link we text before the next order and what the patient answered.
   Subscription board: Reorder Confirmation Link text_mm3khve4 · Reorder Text Sent text_mm3rzqks · Patient Order Response color_mm3kjykc
   (Confirmed / Delay / Cancel / Pause / No Response) · Patient Insurance Response color_mm3k4z79 (Confirmed / Changed / Cancel) ·
   Patient Response Timestamp text_mm3kt9bs · Patient Change Summary long_text_mm3k5y3n · Patient Help Message long_text_mm3xnb6k ── */
const respChip = v => !v ? '' : `<span class="chip ${/confirm/i.test(v)?'green':/no response/i.test(v)?'amber':/delay|pause|changed/i.test(v)?'amber':/cancel/i.test(v)?'red':''}">${esc(v)}</span>`;
const latestEntry = txt => { const parts = String(txt||'').trim().split(/\n\s*\n/).filter(Boolean); return parts.length ? parts[parts.length-1] : ''; };
function reorderLine(p){
  const r = p.reorder;
  const dte = daysUntil(p.nextOrder);
  if (!r) return `<div class="rf"><span class="xs muted">Not sent yet${dte!=null&&dte>0?` · goes out automatically before the ${p.nextOrder} order`:''}</span><button class="btn ghost xs" data-action="resend" title="Text the reorder link now">${ic('send')} Send now</button></div>`;
  const submitted = !!(r.at || (r.orderResponse && !/no response/i.test(r.orderResponse)));
  return `<div class="rf">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener" style="color:var(--primary);white-space:nowrap">${ic('ext')} Open form</a>`:''}${r.sent?`<span class="xs muted">texted ${esc(r.sent)}</span>`:''}${submitted?`${r.at?`<span class="chip green" title="${esc(r.at)}">${ic('check')} Submitted ${esc(r.at.replace(/, \d{4}/,'').replace(/ ET$/,''))}</span>`:''}${r.orderResponse&&(!r.at||!/confirm/i.test(r.orderResponse))?respChip(r.orderResponse):''}`:`<span class="chip amber">No response yet</span><button class="btn ghost xs" data-action="resend" title="Text the reorder link again">${ic('refresh')} Resend</button>`}</div>`;
}
function upcomingOrder(p){
  const r = p.reorder; const dte = daysUntil(p.nextOrder);
  const when = p.nextOrder ? `${p.nextOrder}${dte!=null?` <span class="xs ${dte<0?'warn':'muted'}">(${dte<0?Math.abs(dte)+' days overdue':dte===0?'today':'in '+dte+' days'})</span>`:''}` : '—';
  const lines = [p.infusion&&p.infusion!=='Not Serving'?`${p.qty1||'—'} × ${p.infusion}`:'', p.infusion2&&p.infusion2!=='Not Serving'?`${p.qty2||'—'} × ${p.infusion2}`:'', p.cartridgeQty?`${p.cartridgeQty} × cartridges`:'', p.cgm&&p.cgm!=='Not Serving'?`${p.cgmQty||'—'} × ${p.cgm} sensors`:''].filter(Boolean);
  const F = (k,v,cls='') => `<div class="fact"><div class="k">${k}</div><div class="v ${cls}">${v||'—'}</div></div>`;
  const openLink = r&&r.link ? ` · <a href="${esc(r.link)}" target="_blank" rel="noopener" style="color:var(--primary)">open form</a>` : '';
  let resp;
  if (!r) resp = `<div class="row wrap" style="gap:8px;align-items:center"><span class="chip">Not sent yet</span><button class="btn ghost xs" data-action="resend">${ic('send')} Send now</button></div><div class="xs muted" style="margin-top:4px">Texted automatically ahead of the next order date.</div>`;
  else if (!(r.at || (r.orderResponse && !/no response/i.test(r.orderResponse)))) resp = `<div class="row wrap" style="gap:8px;align-items:center"><span class="chip amber">No response yet</span><button class="btn ghost xs" data-action="resend">${ic('refresh')} Resend</button></div><div class="xs muted" style="margin-top:4px">texted ${esc(r.sent||'—')}${openLink}</div>`;
  else { const entry = latestEntry(r.changes).replace(/^\[[^\]]*\]\s*/,'').replace(/^Patient \w+:\s*/i,'');
    resp = `<div class="row wrap" style="gap:6px;align-items:center"><span class="xs muted">Order</span>${respChip(r.orderResponse||'Confirmed')}<span class="xs muted">Insurance</span>${respChip(r.insResponse||'—')}</div><div class="xs muted" style="margin-top:4px">submitted ${esc(r.at||'—')}${openLink}</div>${entry?`<div class="xs" style="margin-top:4px;white-space:pre-line">${esc(entry)}</div>`:''}${r.help?`<div class="xs" style="margin-top:4px;color:var(--amber-fg)">${ic('msg','width:11px;height:11px')} “${esc(r.help)}”</div>`:''}`; }
  return `<section class="card pad left-teal" style="margin-bottom:14px"><div class="section-h" style="margin-bottom:10px"><div class="eyebrow">Upcoming order</div>${dte!=null&&dte<=14&&dte>=0?`<span class="chip amber">${ic('clock')} places ${dte===0?'today':'in '+dte+' days'}</span>`:''}</div><div class="strip upstrip" style="grid-template-columns:1fr 1fr 1.2fr 1.6fr">${F('Next order',when)}${F('Subscription',esc(p.subscription)+(p.frequency?` <span class="xs muted">· ${esc(p.frequency)}</span>`:''))}${F('Expected items',lines.length?lines.map(esc).join('<br>'):'—')}<div class="fact"><div class="k">Reorder form</div><div class="v" style="font-weight:400">${resp}</div></div></div></section>`;
}

/* ── Subscription · Profile — mirrors today's Subscription Management page, with Brandon's 09-18 changes ── */
function profilePage(p, j, orders, canAdjust){
  const canEdit = can('editProfile'); const ro = canEdit ? '' : ' disabled';

  const dr = `<section class="card pad"><div class="eyebrow" style="margin-bottom:10px">Doctor info</div><div class="facts" style="grid-template-columns:1fr 1fr">${F('Doctor',esc(doc.name))}${F('NPI',doc.npi?`<span class="mono">${esc(doc.npi)}</span>`:'')}</div><div class="fact" style="margin-top:12px"><div class="k">Doctor address</div><div class="input sm" style="margin-top:4px;background:var(--muted)">${esc(doc.addr||doc.clinic||'—')}</div></div><div class="facts" style="grid-template-columns:1fr 1fr;margin-top:12px">${F('Doctor phone',esc(doc.phone))}${F('Doctor fax',esc(doc.fax))}${F('Fax / Parachute',esc(doc.method))}${doc.clinic?F('Clinic',esc(doc.clinic)):''}</div></section>`;
  const fin = (() => { if (state.realData) return {rev:null,cost:null,gp:null,ship:null,arr:null,arp:null,life:null}; const s = seeded(p.id*7); const rev = 380 + Math.round(s*400); const cost = Math.round(rev*0.55); const per = p.frequency==='30-Days'?12:p.frequency==='60-Days'?6:4; return {rev, cost, gp: rev-cost, ship: 8.25, arr: rev*per, arp: (rev-cost)*per - 8.25*per, life: rev*orders.length}; })();
  const finHtml = `<section class="card pad"><div class="eyebrow" style="margin-bottom:10px">Financials</div><div class="xs muted" style="margin-bottom:6px">Supplies</div><div class="facts" style="grid-template-columns:1fr 1fr 1fr">${F('Revenue',money(fin.rev))}${F('Cost',money(fin.cost))}${F('GP',money(fin.gp))}</div><div class="facts" style="grid-template-columns:1fr 1fr 1fr;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${F('Total revenue',money(fin.rev))}${F('Total cost',money(fin.cost))}${F('Total GP',money(fin.gp!=null?fin.gp-(fin.ship||0):null))}</div><div class="facts" style="grid-template-columns:1fr 1fr 1fr;margin-top:12px">${F('Shipping',money(fin.ship))}${F('ARR',money(fin.arr))}${F('ARP',money(fin.arp))}</div><div class="facts" style="grid-template-columns:1fr 1fr;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${F('Lifetime revenue',fin.life!=null?money(fin.life):'<span class="muted">— (price list, live build)</span>')}${F('Total orders',`${orders.length}${first?` <span class="xs muted">since ${first}</span>`:''}`)}</div>${state.realData?'<div class="xs muted" style="margin-top:8px">Money figures come from the price list in the live app; they were not part of the Monday pull.</div>':''}</section>`;

/* ── Subscription · Orders — its own page: the selected order on top (latest by default), order history underneath.
   Click a history row to show that order above. ── */
function ordersPage(p, j, orders, canAdjust){
  if (!orders.length) return `${(j.mode==='subscription'||j.mode==='inactive')?upcomingOrder(p):''}<section class="card pad"><b class="small">No orders on the order board</b><div class="xs muted">${j.mode==='onboarding'||j.mode==='lead'?'The first order is created at Final Profile Confirmation.':'Nothing matched this patient on the New Order Board.'}</div></section>`;
  const latest = orders[0];
  const sel = orders.find(o => String(o.id)===String(state.orderSel)) || latest;
  const isLatest = sel===latest;
  const stat = o => { if (isDDP(o)) return `<span class="pill grey">via DDP</span>`; const S = shipmentsOf(o); const pend = S.unshipped.length>0, nS = S.shipments.length, nD = S.shipments.filter(x=>x.delivered).length; return nS && nD===nS && !pend ? `<span class="pill active">Delivered</span>` : pend && nD ? `<span class="pill lightgreen">Partially delivered</span>` : pend && nS ? `<span class="pill lightgreen">Partially shipped</span>` : o.flag && !/backorder/i.test(o.flag) ? `<span class="pill red">${esc(o.flag)}</span>` : pend && /backorder/i.test(S.unshipped[0].why||'') ? `<span class="pill red">Backordered</span>` : nS ? `<span class="pill blue">In transit</span>` : `<span class="pill amber">${esc(o.status||'Open')}</span>`; };
  const itemsTxt = o => (o.items&&o.items.length) ? o.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(', ') : `${o.qty?o.qty+' × ':''}${esc(o.item||'')}`;
  const rows = orders.map((o,i) => `<tr class="pick${sel===o?' sel':''}" data-action="orderpick" data-v="${o.id}" title="Show this order above"><td class="mono">${o.cah?esc(o.cah):isDDP(o)?'DDP':esc(o.id||'—')}${i===0?' <span class="chip blue" style="font-size:10px;padding:0 5px">latest</span>':''}</td><td>${o.date||'—'}</td><td>${esc(o.type||'')}${o.product?`<div class="xs muted">${esc(o.product)}</div>`:''}</td><td class="items">${itemsTxt(o)}</td><td>${stat(o)}</td><td>${o.shipped||'—'}${o.carrier?`<div class="xs muted">${esc(o.carrier)}${o.track?' · '+esc(o.track):''}</div>`:''}</td><td>${o.delivered||'—'}</td></tr>`).join('');
  const openCount = orders.filter(o=>!o.complete).length;
  const sub = isDDP(sel) ? 'Ordered via DDP — no history available.' : shipmentsOf(sel).unshipped.length ? 'Part of it is still with Cardinal — swap the backordered set from the line below.' : sel.complete ? 'Complete — nothing to do on it.' : 'Still in progress — actions are on it.';
  return `${upcomingOrder(p)}<section><div class="section-h" style="margin-bottom:8px"><div><h2 style="font-size:16px">${isLatest?'Latest order':`Order #${esc(sel.cah||sel.id)}`}${isLatest?'':` <span class="xs muted" style="font-weight:400">· placed ${sel.date||'—'}</span>`}</h2><div class="xs muted">${sub}</div></div><div class="row" style="gap:8px">${isLatest?'':`<button class="btn ghost xs" data-action="orderpick" data-v="${latest.id}">${ic('back')} Back to latest</button>`}${openCount>1?`<span class="chip amber">${openCount} orders still open</span>`:''}</div></div>${orderCard(sel, true, canAdjust)}</section>
    <section class="card" style="margin-top:14px"><div class="section-h" style="padding:12px 14px;border-bottom:1px solid var(--border)"><div><b class="small">Order history</b><div class="xs muted">${orders.length} order${orders.length===1?'':'s'} on the New Order Board${p.orderCount?` · board says ${esc(p.orderCount)}`:''} · newest first · click a row to show it above</div></div><div class="row" style="gap:6px"><button class="btn ghost xs">${ic('sliders')} Filter</button><button class="btn ghost xs">${ic('refresh')}</button></div></div>
      <div class="scroll-x"><table class="otable"><thead><tr><th>Order #</th><th>Created</th><th>Type</th><th>Items</th><th>Status</th><th>Shipped</th><th>Delivered</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

/* The patient's main column — used by the patient screen and embedded in the Communications hub.
   L(extra) builds the links for the in-profile toggles so the same markup works on either route. */
function patientMain(p, q, L){
  L = L || (extra => href('/patient/'+p.id, extra));
  const j = p.journey; const canText = can('comms'); const canAdjust = can('adjustOrders');
  const view = q.view || (j.mode==='subscription' || j.mode==='inactive' ? 'subscription' : 'onboarding');
  const maxStep = j.macro<4 ? j.macro : 3;
  const stepIdx = q.step!=null ? Math.max(0,Math.min(maxStep,+q.step)) : maxStep;
  const F = (k,v,cls='') => `<div class="fact"><div class="k">${k}</div><div class="v ${cls}">${v||'—'}</div></div>`;
  const docLine = p.doc && p.doc.name ? `${esc(p.doc.name)}${p.doc.method?' · '+esc(p.doc.method):''}` : '';
  const onSubBoard = j.mode==='subscription' || j.mode==='inactive' || !!(p.boards && p.boards.sub);
  const vt = `<div class="vtoggle"><a class="${view==='onboarding'?'on':''}" href="${L({view:'onboarding'})}">${ic('clip')} Onboarding <span class="st">${j.mode==='onboarding'?'In progress':j.mode==='lead'?'Lead':'Done'+(j.completed?' '+j.completed:'')}</span></a>${onSubBoard?`<a class="${view==='subscription'?'on':''}" href="${L({view:'subscription'})}">${ic('refresh')} Subscription <span class="st">${j.mode==='subscription'?esc(p.subStatus||'Active'):j.mode==='inactive'?'Not active':esc(p.subStatus||'On the board')}</span></a>`:`<span class="off" aria-disabled="true" title="Not on the Subscription board yet — the row is created at Final Profile Confirmation">${ic('refresh')} Subscription <span class="st">Not yet</span></span>`}</div>`;
  const subTop = `<div class="card pad tb-card"><div class="tb"><div class="fact"><div class="k">Patient name</div><div class="v nm">${esc(p.name)}</div></div><div class="fact"><div class="k">DOB</div><div class="v"><b>${p.dob||'—'}</b></div></div><div class="fact"><div class="k">Email</div><div class="v">${p.email?`<a href="mailto:${esc(p.email)}" style="color:var(--primary)">${esc(p.email)}</a>`:'—'}</div></div><div class="fact"><div class="k">Phone</div><div class="v row" style="gap:6px"><b style="color:var(--primary);font-size:15px">${p.phone||'—'}</b><button class="btn ghost xs" title="Edit phone">${ic('pencil','width:12px;height:12px')}</button></div></div>${vt}</div></div>`;
  const top = subTop;   // the same top bar on both views — only what sits under the Profile | Orders row changes

  let main = '';
  if (view === 'onboarding') {
    const stepper = `<div class="stepper">${j.steps.map((st,mi)=>{ const inner = `<span class="n"><span class="c">${st.state==='done'?ic('check','width:12px;height:12px'):mi+1}</span>${esc(st.label)}</span><span class="s">${st.state==='done'?(st.empty?'Completed':'Completed '+(st.done||'')):st.state==='now'?(st.stuck?'Stuck':(j.current?esc(j.current.label)+' · now':'In progress')):'Not started'}</span><span class="bar"><i style="width:${Math.round(st.progress*100)}%;${st.stuck?'background:var(--destructive)':''}"></i></span>`; return st.state==='todo' ? `<span class="todo off" aria-disabled="true" title="${esc(st.label)} hasn't started — it opens once the patient gets there">${inner}</span>` : `<a class="${st.state}${mi===stepIdx?' sel':''}" href="${L({view:'onboarding',step:mi})}">${inner}</a>`; }).join('')}</div>`;
    const st = j.steps[stepIdx];
    const pillFor = s => s.status==='done' ? '<span class="pill active">Done</span>' : s.status==='now' ? '<span class="pill blue">In progress</span>' : s.status==='stuck' ? '<span class="pill red">Stuck</span>' : '<span class="pill grey">Not started</span>';
    const cards = stageSnapshot(p, j, stepIdx, q);
    const notes = (st.subs[0]&&st.subs[0].notes&&st.subs[0].notes.length) ? st.subs[0].notes : (p.subNotes&&p.subNotes.length ? p.subNotes : []);
    const ago = us => { const d = daysUntil(us); return d==null ? '' : d===0 ? 'today' : d<0 ? `${Math.abs(d)} day${Math.abs(d)===1?'':'s'} ago` : `in ${d} days`; };
    const active = j.macro<4 ? (p.boards||{})[['so','med','ins','wc'][j.macro]] : null;
    const intake = p.intakeDate || p.referralReceived || ((p.boards||{}).so && p.boards.so.created) || (j.steps[0] && j.steps[0].done) || '';
    const stageStart = active ? (active.stageStart || active.created || '') : (j.macro>0 && j.steps[j.macro-1] ? j.steps[j.macro-1].done : intake) || '';

      inssubs.push(sub('benefits','Insurance', 'done', [fld('Primary / secondary', [p.primary, p.secondary].filter(Boolean).join(' / '))], {keepEmpty:true, route:'/stage/benefits', note:'Completed before this patient was on the Insurance board.'}));
    }
    steps.push({key:'insurance', label:'Insurance', short:'Insurance', subs: inssubs, board: ins});
    /* ── 4 Welcome Call ── */
    let wcsubs = [];
    if (wc) {
      const devices = [p.pump&&p.pump!=='Not Serving'?p.pump:'', p.cgm&&p.cgm!=='Not Serving'?p.cgm:''].filter(Boolean).join(' + ');
      wcsubs.push(sub('welcomeCall','Welcome Call', 'todo', [fld('Attempts', wc.attemptStatus||wc.attempts), fld('Address', p.address), fld('Devices', devices), fld('Subscription', wc.subType), fld('Infusion set', wc.inf1 ? `${wc.inf1} × ${wc.qty1||'?'}` : ''), fld('Infusion set 2', wc.inf2 ? `${wc.inf2} × ${wc.qty2||'?'}` : ''), fld('Cartridges', wc.cartridgeQty), fld('Place of service', wc.pos), fld('Order frequency', wc.frequency), fld('Follow up', wc.followUpDate), fld('Caregiver', p.caregiver)], {route:'/stage/welcomeCall', when: wc.followUpDate||wc.stageStart}));
      wcsubs.push(sub('finalConfirm','Final Profile Confirmation', 'todo', [fld('Advance?', wc.advance), fld('Order handling', wc.handling), fld('Escalation', wc.escalation)], {route:'/stage/finalConfirm', when: wc.stageStart}));
      const active = ['Welcome Call','Final Profile Confirmation','Stuck','Escalation'].includes(wc.group);

    } else if (later.wc) {
      wcsubs.push(sub('welcomeCall','Welcome Call', 'done', [fld('Subscription', sb&&sb.type)], {keepEmpty:true, route:'/stage/welcomeCall', note:'Completed before this patient was on the Welcome Call board.'}));
    }
    steps.push({key:'welcome', label:'Welcome Call', short:'Welcome Call', subs: wcsubs, board: wc});
    /* macro states */
    const macro = p.macro; const mode = p.mode;
    steps.forEach((st, mi) => {
      const n = st.subs.length, d = st.subs.filter(s=>s.status==='done').length, hasNow = st.subs.some(s=>s.status==='now'||s.status==='stuck');
      st.state = (mode==='subscription'||mode==='inactive'||mi<macro) ? 'done' : mi===macro ? 'now' : 'todo';
      if (st.state==='done' && n===0) st.empty = true;
      st.progress = st.state==='done' ? 1 : st.state==='now' ? (n ? (d + (hasNow?.5:0))/n : .5) : 0;
      const dates = st.subs.filter(s=>s.status==='done'&&s.when).map(s=>s.when);
      st.done = dates.length ? dates[dates.length-1] : (st.board && (st.board.stageStart||st.board.created)) || '';
      st.stuck = st.subs.some(s=>s.status==='stuck');
    });
    const curStep = macro<4 ? steps[macro] : null;
    const current = curStep ? curStep.subs.find(s=>s.status==='now'||s.status==='stuck') : null;
    const active = macro===0 ? so : macro===1 ? me : macro===2 ? ins : macro===3 ? wc : null;
    return { mode, macro, steps, current, completed: (sb && (sb.created)) || (wc && wc.stageStart) || '', daysInStage: active ? (active.daysNum!=null ? active.daysNum : null) : 0, daysLabel: active ? active.daysLabel||'' : '', stuck: p.stuck };
  }

  function toOrder(o){
    const item = (o.items||[]).map(i=>`${i.qty} × ${i.name}`).join(' · ') || o.subType || 'Order';
    const qty = (o.items||[]).reduce((a,i)=>a+i.qty,0);
    const st = o.complete ? 'Delivered' : (o.api==='SHIPPED'||o.api==='Partially Shipped') ? (o.api==='Partially Shipped'?'Partially shipped':'Shipped') : (o.api==='Accepted') ? 'Accepted — not shipped' : o.status==='Ordered' ? 'Placed — waiting for Cardinal' : o.status || o.api || 'Placed';
    return { id:o.itemId, date:o.date, type:o.type, product:o.subType, item, qty, status: st, api: o.api||'', flag: o.flag||'', reason: o.flag ? o.flag : st, apiMsg: [...new Set(String(o.apiMsg||o.hold||'').split('; ').map(x=>x.trim()).filter(Boolean))].join('; '), carrier:o.carrier, track:o.track, shipped:o.shipped, estShip:o.estShip, delivered:o.delivered, signedBy:o.signedBy, cah:o.cah, po:o.po, complete:!!o.complete, items:o.items||[], subSet:o.subSet, subStatus:o.subStatus, subCah:o.subCah, backorderQty:o.backorderQty, backordered:o.backordered, warehouse:o.warehouse, preCheck:o.preCheck, shipText:o.shipText, checkin:o.checkin, shipTo:o.shipTo, lastSync:o.lastSync, real:true };
  }

  /* ── swap the sample world for the real one ── */
  const real = R.patients.map((p, i) => {
    const sb = (p.boards||{}).sub || {};
    const q = { id: i+1, uid: p.uid||p.id, name: p.name, dob: p.dob||'', gender: p.gender||'', phone: p.phone||'', altPhone: p.altPhone||sb.altPhone||'', email: p.email||'', address: p.address||'', canText: p.canText||sb.canText||'', caregiver: p.caregiver||sb.caregiverName||'',
      primary: p.primary||p.generalInsurance||'', memberId: p.memberId||'', secondary: p.secondary||'', memberId2: p.memberId2||'', dedRemaining: p.dedRemaining||sb.dedRemaining||'', oopRemaining: p.oopRemaining||sb.oopMaxRemaining||'',
      doc: Object.assign({name:'', npi:'', phone:'', fax:'', clinic:'', addr:'', method:''}, p.doc||{}),
      product: p.serving||p.request||'', request: p.request||'', serving: p.serving||'', pump: p.pump||sb.suppliesType||'', cgm: p.cgm||sb.sensorsType||'', infusion: sb.inf1||'', qty1: sb.qty1||'', infusion2: sb.inf2||'', qty2: sb.qty2||'', cartridgeQty: sb.cartridgeQty||'', cgmQty: sb.cgmQty||'',
      diagnosis: p.diagnosis||'', cgmCoverage: sb.cgmCoverage||p.cgmPath||'', ipPath: p.ipPath||'', cgmPath: p.cgmPath||'', referralType: p.referralType||'', referralSource: p.referralSource||sb.referral||'', intakeDate: p.intakeDate||'',
      subscription: sb.type||'', daysToOrder: sb.daysToOrder||'', cycle: sb.cycle||'', nextOrder: sb.nextOrder||'', orderType: sb.orderType||'', frequency: sb.frequency||'', subStatus: sb.status||'', pos: sb.pos||'',
      mr: sb.mr||'', mnExpiry: sb.mnExpiry||'', sensorsAuth: sb.sensorsAuth||'', suppliesAuth: sb.suppliesAuth||'', sensorsAuthId: sb.sensorsAuthId||'', sensorsAuthEnd: sb.sensorsAuthEnd||'', infusionAuthId: sb.infusionAuthId||'', cartridgeAuthId: sb.cartridgeAuthId||'', suppliesAuthEnd: sb.suppliesAuthEnd||sb.infusionAuthEnd||'', eligActive: sb.eligActive||'', priorAuthReq: sb.priorAuthReq||'', lastEligCheck: sb.lastEligCheck||'', oopEstimate: sb.oopEstimate||'', orderCount: sb.orderCount||'', nextDocAppt: sb.nextDocAppt||'', insuranceChange: sb.insuranceChange||'',
      subNotes: notesOf(sb.notes), boards: p.boards||{}, mode: p.mode, macro: p.macro, stuck: !!p.stuck, escalated: false, realOrders: (p.orders||[]).map(toOrder),
      // reorder (resupply) form + contact block + insurance extras (Subscription board, pulled 09-18 pm)
      reorder: (sb.reorderLink||sb.reorderSent||sb.orderResponse||sb.responseAt) ? { link: sb.reorderLink||'', sent: sb.reorderSent||'', orderResponse: sb.orderResponse||'', insResponse: sb.insResponse||'', at: sb.responseAt||'', changes: sb.changeSummary||'', help: sb.helpMessage||'' } : null,
      primaryContact: p.primaryContact||sb.primaryContact||'', altContact: sb.altContact||'', caregiverAuth: sb.caregiverAuth||'', lastContact: sb.lastContact||'', referralSourceSub: sb.referralSource||'', referralRep: sb.referral||'', oopMax: sb.oopMax||'', deductible: sb.deductible||'' };
    q.escalated = ['med','ins','wc','so'].some(k => q.boards[k] && /Escalation/.test(q.boards[k].escalation||''));
    if (q.mode==='lead') { const so = q.boards.so||{}; const webForm = !!so.dropOff || !!so.reason || !!so.lastFormActivity || q.referralType==='Patient'; if (!webForm) { q.mode = 'onboarding'; q.macro = 0; q.importedReferral = true; } }
    q.journey = journey(q);
    return q;
  });
  PATIENTS.length = 0; real.forEach(p => PATIENTS.push(p));
  ORDERS.length = 0; TEXTS.length = 0; CALLS.length = 0; VOICEMAILS.length = 0; FAXES.length = 0;
  window.ordersFor = p => p.realOrders || [];
  window.textsFor = p => ({ p, optedOut: p.canText==='No', thread: [], none: true });
  // real Cardinal SKU tracker
  SKUS_ALL.length = 0;
  R.skus.forEach(s => SKUS_ALL.push({ product: s.name, sku: s.sku||'', status: s.status||'', qty: +s.qty||0, cost: s.cost ? `$${(+s.cost).toFixed(2)}` : '—', oop: s.oop ? `$${(+s.oop).toFixed(2)}` : '—', open: '—', changed: s.changed||'', cat: s.group||'' }));
  // real queue counts for the bars (as of the snapshot) — one filter per bar, reused for the count, the escalation
  // count and the queue page's patient list, so the three never disagree
  const g = (k, grp) => p => p.boards[k] && p.boards[k].group===grp;
  const mn = adv => p => p.boards.med && p.boards.med.group==='2. Medical Necessity' && p.boards.med.advancer===adv;
  const F = {
    profile: g('so','1. Intake'), unverifiedReferrals: p => p.boards.so && (p.boards.so.group==='New Form — Partial Leads'||p.boards.so.group==='New Form — Completed'), intakeCleanup: g('so','Profile Clean-Up'), inSystemReferrals: g('so','Already In System'),
    scheduledCalls: p => p.boards.so && (p.boards.so.booking==='Scheduled' || !!p.boards.so.scheduledCall),
    evaluate: mn('Evaluate MN'), sendRequest: mn('Send Request'), confirmReceipt: mn('Confirm Receipt'), chaseFax: p => mn('Chase Clinicals')(p) && p.doc.method==='Fax', chaseParachute: p => mn('Chase Clinicals')(p) && p.doc.method!=='Fax', doctorAppointments: mn('Doctor Appointment'),
    benefits: g('ins','Benefits'), submitAuth: g('ins','Submit Auth'), authOutstanding: g('ins','Auth Outstanding'), dvs: g('ins','DVS'), authDenied: g('ins','Auth Denied'), welcomeCall: g('wc','Welcome Call'), finalConfirm: g('wc','Final Profile Confirmation'),
    subscription: p => p.boards.sub && (p.boards.sub.status==='Active'||p.boards.sub.status==='Paused'), updateClinicals: p => p.boards.sub && (p.boards.sub.status==='Active'||p.boards.sub.status==='Paused'), orders: p => p.realOrders.length && !p.realOrders[0].complete,
  };

  const C = {};
  Object.keys(F).forEach(id => { C[id] = real.filter(F[id]).length; });
  ROLES.forEach(r => {
    if (C[r.id]!=null) { r.count = C[r.id]; const k = boardOf[r.id]; r.esc = k ? real.filter(p => F[r.id](p) && /Escalat/i.test((p.boards[k]||{}).escalation||'')).length : 0; }
    else if (!r.adhoc) { r.count = 0; r.esc = 0; r.snapshotNA = true; }  // FAX / Patient Questions / Communications live on boards that were not exported

})();

    <div class="acc-body">

/* ── Manager oversight (Janelle's view, and /oversight for every manager) ──

const OV_STAGE_OF = p => { const j = p.journey||{}; return j.mode==='onboarding' ? ['intake','medical','insurance','welcome'][j.macro] || 'welcome' : j.mode==='lead' ? 'intake' : null; };

  if (!state.realData || !window.CC_POOL) return OV;

  const dOf = k => p => p.boards[k] ? p.boards[k].daysNum : null;
  const hist = (title, list, dayOf) => { const vals=[0,0,0,0,0,0,0,0]; let unk=0, vip=0; list.forEach(p=>{ const b=bucket(dayOf(p)); if(b<0) unk++; else vals[b]++; if (p.escalated) vip++; }); return [title, list.length, 0, vals, unk]; };
  const pool = id => window.CC_POOL(id);
  const esc_ = k => p => /escalat/i.test((p.boards[k]||{}).escalation||'');
  const stuck = k => p => p.boards[k] && (p.boards[k].group==='Stuck' || /stuck/i.test(p.boards[k].proposedStuck||''));
  const on = k => PATIENTS.filter(p => p.boards[k]);
  const chase = pool('chaseFax').concat(pool('chaseParachute'));
  const sum = cols => cols.reduce((a,c)=>a+c[1],0);
  const S = {
    intake: {label:'Patient Intake', cols:[
      [hist('Non-Referral Intake — Info Collection', pool('unverifiedReferrals'), dOf('so')), hist('Intake — Profile Clean-Up', pool('intakeCleanup'), dOf('so')), hist('Profile Send Off — Referral Intake', pool('profile'), dOf('so')), hist('Profile Send Off — Already In System', pool('inSystemReferrals'), dOf('so'))],
      [hist('Info Collection (Escalated)', pool('unverifiedReferrals').filter(esc_('so')), dOf('so')), hist('Referral Intake (Escalated)', pool('profile').concat(pool('inSystemReferrals')).filter(esc_('so')), dOf('so'))],
      [hist('Intake (Proposed Stuck)', on('so').filter(stuck('so')), dOf('so'))]]},
    medical: {label:'Medical Evaluation', cols:[
      [hist('Evaluate', pool('evaluate'), dOf('med')), hist('Send Request', pool('sendRequest'), dOf('med')), hist('Confirm Receipt', pool('confirmReceipt'), dOf('med')), hist('Chase Clinicals', chase, dOf('med')), hist('Doctor Appointment', pool('doctorAppointments'), dOf('med'))],
      [hist('Evaluate (Escalated)', pool('evaluate').filter(esc_('med')), dOf('med')), hist('Send Request (Escalated)', pool('sendRequest').filter(esc_('med')), dOf('med')), hist('Confirm Receipt (Escalated)', pool('confirmReceipt').filter(esc_('med')), dOf('med')), hist('Chase Clinicals (Escalated)', chase.filter(esc_('med')), dOf('med'))],
      [hist('Medical Evaluation (Proposed Stuck)', on('med').filter(stuck('med')), dOf('med'))]]},
    insurance: {label:'Insurance', cols:[
      [hist('Benefits', pool('benefits'), dOf('ins')), hist('Submit Auth', pool('submitAuth'), dOf('ins')), hist('Auth Outstanding', pool('authOutstanding'), dOf('ins')), hist('DVS', pool('dvs'), dOf('ins'))],
      [hist('Insurance (Escalated)', on('ins').filter(p=>['Benefits','Submit Auth','Auth Outstanding','DVS','Escalations'].includes(p.boards.ins.group)).filter(esc_('ins')), dOf('ins'))],
      [hist('Insurance (Proposed Stuck)', on('ins').filter(stuck('ins')), dOf('ins')), hist('Auth Denied', pool('authDenied'), dOf('ins'))]]},
    welcome: {label:'Welcome Call', cols:[

      [hist('Welcome Call (Escalated)', pool('welcomeCall').concat(pool('finalConfirm')).filter(esc_('wc')), dOf('wc'))],
      [hist('Welcome Call (Proposed Stuck)', on('wc').filter(stuck('wc')), dOf('wc'))]]},

}

/* ── Calls for a patient (sample) — the live build reads RingCentral call history for the patient's number ── */
function callsFor(p){
  const out = [];
  CALLS.filter(c => c.p===p).forEach(c => out.push({kind: c.missed ? 'missed' : c.dir, who: c.who, t: c.t, dur: c.dur, rec: c.rec, by: c.dir==='out' ? 'Josh' : ''}));
  VOICEMAILS.filter(v => v.p===p).forEach(v => out.push({kind:'vm', who:'Voicemail', t: v.t, dur: v.dur, rec:true, transcript: v.transcript, heard: v.heard}));
  const seed = seeded(p.id*13);
  const reps = PEOPLE.filter(x=>x.answers).map(x=>x.name[0].toUpperCase()+x.name.slice(1));
  const gen = [
    {kind:'out', who:'We called', t: dOff(2)+' 10:12 AM', dur:'3:41', rec:true, by: reps[Math.floor(seed*reps.length)]},
    {kind:'missed', who:'Missed call', t: dOff(4)+' 4:07 PM', dur:'', rec:false},
    {kind:'vm', who:'Voicemail', t: dOff(4)+' 4:08 PM', dur:'0:32', rec:true, transcript:`Hi, it's ${p.name.split(' ')[0]}, returning your call about the paperwork — please call me back.`, heard: seed>.5},
    {kind:'in', who:'Patient called', t: dOff(9)+' 9:48 AM', dur:'6:05', rec:true, by: reps[Math.floor(seed*7)%reps.length]},
    {kind:'out', who:'We called', t: dOff(16)+' 1:20 PM', dur:'2:14', rec:true, by: reps[Math.floor(seed*3)%reps.length]},
  ];
  gen.slice(0, 2 + Math.floor(seed*4)).forEach(c => out.push(c));
  return { p, calls: out, none: false };
}
if (state.realData) { callsFor = p => ({ p, calls: [], none: true }); }   // RingCentral data was not exported with the snapshot

/* ── Real communications sample: Monday board "Faxes, Calls, VMS, Parachute" (window.CC_COMMS) ──
   texts / missed calls / voicemails stop on 07/14/2026 (the feed moved to RingCentral directly); faxes are current.
   Only inbound traffic lives on this board. Josh's live build already reads RingCentral directly (inbound + outbound texts, the
   full call log, recordings you can play and download) — that stays; the sample is only so the screens can be seen with real traffic. */
if (window.CC_COMMS) (function(){
  const K = window.CC_COMMS;
  const d10 = s => digits(s).slice(-10);
  const findP = c => { const d = d10(c.phone||''); let p = d.length===10 ? PATIENTS.find(x => d10(x.phone)===d || d10(x.altPhone)===d) : null;
    if (!p && c.name) { const parts = c.name.toLowerCase().replace(/,/g,' ').split(/\s+/).filter(w => w.length>1); if (parts.length>=2) p = PATIENTS.find(x => parts.every(w => x.name.toLowerCase().includes(w))); }
    return p || null; };
  const stub = c => ({ id:null, name: c.name || c.phone || 'Unknown', phone: c.phone||'', dob:'', journey:{mode:'unknown', steps:[]}, doc:{name:''}, primary:'', boards:{} });
  const convs = new Map();
  K.texts.forEach(c => { const key = c.phone || c.name; if (!convs.has(key)) convs.set(key, {c, msgs:[]}); convs.get(key).msgs.push(c); });
  TEXTS.length = 0;
  convs.forEach(({c, msgs}) => { const p = findP(c) || stub(c); TEXTS.push({ p, matched: !!p.id, last: msgs[0].text, t: msgs[0].when, unread: true, thread: msgs.slice().reverse().map(m => ['in', m.text, m.when]), inboundOnly: true, real: true }); });
  CALLS.length = 0; K.calls.forEach(c => { const p = findP(c) || stub(c); CALLS.push({ p, matched: !!p.id, who: c.phone, phone: c.phone, dir:'in', t: c.when, dur: c.to ? 'to '+c.to : '', missed: true, rec: false, to: c.to, real: true }); });
  VOICEMAILS.length = 0; K.voicemails.forEach(c => { const p = findP(c) || stub(c); VOICEMAILS.push({ p, matched: !!p.id, from: c.name || c.phone, t: c.when, dur: c.dur, heard: false, transcript: c.transcript, real: true }); });
  FAXES.length = 0; K.faxes.forEach(c => FAXES.push({ office: c.name || c.phone, number: c.phone, city: '', pages: c.pages, t: c.when, read: false, doc: null, real: true }));
  window.textsFor = p => { const t = TEXTS.find(x => x.p===p); return t ? { p, optedOut: p.canText==='No', thread: t.thread, none: false, inboundOnly: true } : { p, optedOut: p.canText==='No', thread: [], none: true }; };
  callsFor = p => { const out = [];
    CALLS.filter(c => c.p===p).forEach(c => out.push({ kind:'missed', who:'Missed call', t: c.t, dur:'', rec:false, note: c.to ? 'rang '+c.to : '' }));
    VOICEMAILS.filter(v => v.p===p).forEach(v => out.push({ kind:'vm', who:'Voicemail', t: v.t, dur: v.dur, rec:true, transcript: v.transcript, heard:false }));
    return { p, calls: out, none: out.length===0 }; };
  state.commsNote = K.source;
})();

<script>
/* ═══════════════════════════════════════════════════════════════════════

   Snapshots: the bottom panel of the Onboarding view shows each sub-stage's tool exactly as it looked when the
   patient left it — the same cards and fields as the live stage page, rendered READ-ONLY (nothing here writes).
   Fax bar: faxes on the left, Josh's Update Clinicals flow on the right (search a patient → visit date /
   office replied / submit back to Evaluate). Replaces the old Update Clinicals button.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── read-only field primitives ── */
const ro = (label, v, opts={}) => `<div class="rof${opts.wide?' wide':''}"><div class="k">${esc(label)}</div><div class="v ${opts.cls||''}${v==null||v===''?' empty':''}">${v==null||v===''?'—':(opts.raw?v:esc(String(v)))}</div></div>`;
const roSeg = (label, v, choices) => `<div class="rof"><div class="k">${esc(label)}</div><div class="roseg">${choices.map(c=>`<span class="${String(v||'').toLowerCase()===c.toLowerCase()?'on':''}">${esc(c)}</span>`).join('')}${v&&!choices.some(c=>c.toLowerCase()===String(v).toLowerCase())?`<span class="on other">${esc(v)}</span>`:''}</div></div>`;
const roText = (label, v) => `<div class="rof wide"><div class="k">${esc(label)}</div><div class="v ta${v?'':' empty'}">${v?esc(v):'—'}</div></div>`;
const roFiles = (label, files) => `<div class="rof wide"><div class="k">${esc(label)}</div>${files&&files.length?`<div class="stack" style="gap:4px">${files.map(f=>`<div class="filerow ro">${ic('file')} <span class="grow">${esc(f)}</span><span class="xs muted">view only</span></div>`).join('')}</div>`:'<div class="v empty">No files on this item.</div>'}</div>`;
const roCard = (title, body, sub='') => `<section class="card pad snapcard"><div class="snap-ct">${esc(title)}</div>${sub?`<div class="xs muted" style="margin:-4px 0 8px">${esc(sub)}</div>`:''}<div class="rogrid">${body}</div></section>`;
const yn = v => v==null||v==='' ? '' : /^(yes|true|1)$/i.test(String(v)) ? 'Yes' : /^(no|false|0)$/i.test(String(v)) ? 'No' : String(v);
const first = (...xs) => { for (const x of xs) if (x!=null && x!=='' && !(Array.isArray(x)&&!x.length)) return x; return ''; };
const fieldOf = (sub, label) => { if (!sub || !sub.fields) return ''; const f = sub.fields.find(x => String(x[0]).toLowerCase()===label.toLowerCase()); return f && f[1]!=='—' ? f[1] : ''; };
const attemptsOf = (sub, re=/attempt/i) => sub && sub.fields ? sub.fields.filter(x=>re.test(x[0])&&x[1]&&x[1]!=='—').map(x=>x[1]) : [];
const docOf = p => p.doc || {};
const boardsOf = p => p.boards || {};
const sampleFiles = (p, kinds) => state.realData ? [] : kinds.map(k => `${p.name.replace(/\s+/g,'_')}_${k}.pdf`);

/* ── which sub-stages belong to each macro stage, in the order the tools run ── */

  0: ['infoCollection','intakeCall','cleanup','referralIntake','sendOff'],
  1: ['evaluate','sendRequest','confirmReceipt','chase','doctorAppt'],
  2: ['benefits','submitAuth','authOutstanding','authDenied','dvs'],
  3: ['welcomeCall','finalConfirm'],
};
const SNAP_TOOL = { infoCollection:'Unverified Referrals', intakeCall:'Patient Intake Call', cleanup:'Intake Clean-Up', referralIntake:'Profile Send-Off', sendOff:'Profile Send-Off',
  evaluate:'Evaluate MN', sendRequest:'Send Request', confirmReceipt:'Confirm Receipt', chase:'Chase Clinicals', doctorAppt:'Doctor Appointments',
  benefits:'Benefits', submitAuth:'Submit Auth', authOutstanding:'Auth Outstanding', authDenied:'Auth Denied', dvs:'DVS (NY Medicaid)',
  welcomeCall:'Welcome Call', finalConfirm:'Final Profile Confirmation' };

/* ── the pages, card by card, mirroring the live stage tools (titles and labels lifted from the deployed build) ── */
function snapPage(key, p, j, sub){
  const d = docOf(p), b = boardsOf(p), so = b.so||{}, me = b.med||{}, ins = b.ins||{}, wc = b.wc||{}, sb = b.sub||{};

      cards.push(roCard('Provided Doctor Info', ro('Provided Doctor Name', first(so.providedDoctor, d.name)) + ro('Provided Clinic Phone / Location', first(so.providedClinicPhone, d.phone))));
      cards.push(roCard('Care Assessment · Cost & Coverage', ro('Self Advocacy', first(fieldOf(sub,'Self advocacy'))) + ro('Current Out-of-Pocket Cost', first(so.oopFirst, fieldOf(sub,'Out-of-pocket')))));
      cards.push(roCard('Proceed Preference', roSeg('How would they like to proceed?', first(so.proceed, fieldOf(sub,'Proceed preference')), ['Wants a call first','Ready to proceed']) + roSeg('Booking', first(so.booking, fieldOf(sub,'Booking')), ['Not booked','Booked appointment','Reschedule appointment']) + ro('Scheduled call', first(so.scheduledCall, fieldOf(sub,'Scheduled call'))) + ro('Duplicate check', first(so.dupCheck, fieldOf(sub,'Duplicate check')))));
      cards.push(roCard('Call Log & Notes', ro('Call attempts', first(so.attempts, fieldOf(sub,'Attempts'))) + ro('Last form activity', first(so.lastFormActivity, fieldOf(sub,'Last form activity'))) + ro('Drop-off step', first(so.dropOff, fieldOf(sub,'Came in via'))) + roSeg('Patient info complete', yn(first(so.intakeCallDone, fieldOf(sub,'Call complete'))), ['Yes','No']) + roSeg('Escalation', first(so.escalation, fieldOf(sub,'Escalation')), ['None','Escalation Required','Done']) + roText('Notes', (so.notes||[]).slice(0,4).map(n=>`${n.when||''} ${n.text}`).join('\n'))));
      break; }
    case 'cleanup':
    case 'referralIntake':

/* ── the snapshot panel: sub-stage toggle + read-only page ── */
function stageSnapshot(p, j, mi, q){
  const st = j.steps[mi]; if (!st) return '';
  const order = SNAP_ORDER[mi] || [];
  const subs = order.map(k => st.subs.find(s => s.key===k)).filter(Boolean).concat(st.subs.filter(s => !order.includes(s.key)));
  if (!subs.length) return `<section class="card pad small muted">${st.state==='done'?'This patient completed this stage before it was tracked on its own board — no snapshot to show.':'Nothing here yet.'}</section>`;
  const wanted = q.snap && subs.find(s => s.key===q.snap);
  const sel = wanted || subs.find(s => s.status==='now' || s.status==='stuck') || [...subs].reverse().find(s => s.status==='done') || subs[0];
  const L = extra => href('/patient/'+p.id, Object.assign({view:'onboarding', step:mi}, extra));
  const tabs = subs.length>1 ? `<div class="segc snap-tabs">${subs.map(s => `<a class="${s===sel?'on':''}${s.status==='todo'?' off':''}" href="${L({snap:s.key})}" title="${s.status==='todo'?'Not reached yet':s.status==='done'?'Left '+(s.when||''):'Where the patient is now'}">${s.status==='done'?ic('check','width:11px;height:11px'):''}${esc(s.label)}</a>`).join('')}</div>` : `<b class="small">${esc(sel.label)}</b>`;
  const stamp = sel.status==='done' ? `<span class="chip green">${ic('check')} Snapshot · as it looked when ${esc(sel.label)} was left${sel.when?' '+esc(sel.when):''}${sel.who?' by '+esc(sel.who):''}</span>`
    : sel.status==='todo' ? `<span class="chip">Not reached yet — nothing recorded</span>`
    : `<span class="chip blue">${ic('activity')} Live — the patient is here now${sel.who?' · '+esc(sel.who):''}</span>`;
  const body = sel.status==='todo' ? `<div class="card pad small muted">The ${esc(SNAP_TOOL[sel.key]||sel.label)} tool opens once the patient reaches this step.</div>` : snapPage(sel.key, p, j, sel);
  return `<section class="snap">
    <div class="snap-h">${tabs}<div class="row wrap" style="gap:6px;margin-left:auto">${stamp}<span class="chip grey" title="Nothing on this panel writes to Monday — it is the record of what each tool saw">${ic('eye')} Read-only</span>${sel.route&&sel.status!=='todo'?`<a class="btn outline xs" href="${href(sel.route,{patient:p.id})}">${ic('ext')} Open ${esc(SNAP_TOOL[sel.key]||sel.label)}</a>`:''}</div></div>
    <div class="snap-page"><div class="snap-tool">${ic('clip')} ${esc(SNAP_TOOL[sel.key]||sel.label)} <span class="muted">· ${esc(p.name)}</span></div><div class="notice amber xs snap-note">${ic('alert')} <div><b>Stand-in.</b> In the live build this panel is the actual ${esc(SNAP_TOOL[sel.key]||sel.label)} screen — identical to the workflow page, only the navy header and the patient header card removed — rendered read-only with the values as they were when the patient left the step. The cards below only stand in for it.</div></div>${body}</div>
  </section>`;
}

const UC_CHOICES = [
  {id:'same-records', label:'Same old records', hint:'The office sent what they already had — nothing newer exists yet.', takesAppointment:true},
  {id:'new-provider', label:'New provider', hint:'The patient has moved to another practice.', takesAppointment:false, detail:{label:'New provider details', placeholder:'Name, practice, phone or fax — whatever the office gave you', required:false}},
  {id:'other', label:'Other', hint:'Anything else worth recording about the reply.', takesAppointment:false, detail:{label:'What they said', placeholder:'e.g. patient has not been seen since 2025 and will not return calls', required:true}},
];
const ucBoardOf = p => { const j = p.journey||{}; return j.mode==='subscription'||j.mode==='inactive' ? 'subscription' : (j.mode==='onboarding' && j.macro===1) ? 'mn' : 'other'; };
const ucBoardChip = p => { const b = ucBoardOf(p); const j = p.journey||{}; return b==='subscription' ? `<span class="chip sub">Subscription · ${esc(p.subStatus||'Active')}</span>` : b==='mn' ? `<span class="chip mn">Med Necessity · ${esc(j.current?j.current.label:'Evaluate')}</span>` : `<span class="chip">${j.mode==='lead'?'Web-form lead':'Onboarding · '+esc(j.steps&&j.steps[Math.min(j.macro||0,3)]?j.steps[Math.min(j.macro||0,3)].label:'')}</span>`; };
const ucSearchRows = (qs, limit=25) => { const s = (qs||'').trim().toLowerCase(); if (!s) return []; return PATIENTS.filter(p => p.name.toLowerCase().includes(s)).slice(0, limit); };
const faxDigits = s => String(s||'').replace(/\D/g,'').slice(-10);
function faxLikely(f){ if (!f) return []; if (f.doc) return PATIENTS.filter(p => p.doc===f.doc).slice(0,5); const d = faxDigits(f.number); if (!d) return []; return PATIENTS.filter(p => p.doc && faxDigits(p.doc.fax)===d).slice(0,5); }
function faxRows(){
  if (state.realData) return FAXES.map((f,i)=>Object.assign({i}, f));
  return [...FAXES, ...FAXES.map(f=>({...f, t:'Sep 16, '+f.t.split(', ')[1], read:true}))].map((f,i)=>Object.assign({i}, f));
}
function ucPane(f){
  const sel = state.ucPatient ? P(state.ucPatient) : null;
  const likely = faxLikely(f);
  if (!sel) {

<script>
/* ═══════════════════════ router + shell + mock toolbar ═══════════════════════ */
const ROUTES = {
  '/': viewDashboard, '/dashboard': viewDashboard,
  '/subscription': viewSubscription, '/orders': viewOrders, '/update-clinicals': viewUpdateClinicals,
  '/communications': viewComms, '/assigned-patients': viewComms,
  '/system-mgmt': viewSystemMgmt, '/oversight': viewOversight, '/access': viewUsers, '/users': viewUsers, '/reports': viewReports, '/fax-inbox': viewFaxInbox,

  '/inventory': viewInventoryList,     // Cardinal stock — the Inventory button
};
// Live-app routes → the generic stage view
const STAGE_ROUTES = Object.fromEntries(ROLES.filter(r=>r.route && !r.adhoc && r.id!=='fax').map(r=>[r.route, r.id]));
STAGE_ROUTES['/chase-benefits'] = 'chaseFax'; STAGE_ROUTES['/scheduled-calls'] = 'scheduledCalls';

/* Shell: 'search' = the redesign (global header with search + Inventory); 'current' = the live app as it is today, for comparison. */
state.layout = 'search';
// the layout is deliberately NOT remembered between loads: the file always opens on the redesign, 'As today' is only for a side-by-side look
try { const s = JSON.parse(localStorage.getItem('cc-mock')||'{}'); if (s.settings) Object.assign(state.settings, s.settings); } catch(e){}
const persistAll = () => { try { localStorage.setItem('cc-mock', JSON.stringify({viewAs:state.viewAs, accent:state.accent, layout:state.layout, settings:state.settings})); } catch(e){} };

function shell(html, path){
  if (state.layout==='search') return `<div class="shell redesign" style="flex-direction:column">${globalHeader(path)}<div class="shell-main">${html}</div></div>`;
  return `<div class="shell current"><div class="shell-main">${html}</div></div>`;
}

function mockBar(){
  const opts = PEOPLE.map(p=>`<option value="${p.key}"${state.viewAs===p.key?' selected':''}>${p.admin?'Admin':p.manager?'Manager':'Processor'} · ${p.name}${homeViewsOf(p).join()!=='bars'?' · '+viewLabel(p):''}</option>`).join('');
  const old = [['','Old pages (as today)…'],['#/subscription','Subscription Management'],['#/orders','Orders'],['#/update-clinicals','Update Clinicals'],['#/communications','Communications hub'],['#/system-mgmt','System Management'],['#/fax-inbox','Fax Inbox']];
  return `<div class="mock-bar" role="toolbar" aria-label="Mockup controls"><span style="opacity:.7">${state.realData?'Monday snapshot '+esc(state.snapshot):'Sample data'}</span>
    <select id="layoutSel" aria-label="Layout" title="Which shell to show"><option value="search"${state.layout==='search'?' selected':''}>Layout: the redesign</option><option value="current"${state.layout==='current'?' selected':''}>Layout: as today (for comparison)</option></select>${state.layout==='current'?`<span style="color:#fbbf24;font-weight:600">← you're on today's layout</span>`:''}
    <select id="viewAs" aria-label="Viewing as" title="Viewing as">${opts}</select>
    <select id="oldSel" aria-label="Old pages" title="Open one of today's pages for comparison">${old.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>
    <a href="#/">Home</a><a href="#/features">Feature list</a></div>`;
}

function render(){
  const {path, q} = parseHash();
  document.documentElement.setAttribute('data-accent', state.accent||'');
  document.documentElement.setAttribute('data-theme', state.settings.theme==='system' ? '' : state.settings.theme);
  let html;
  if (ROUTES[path]) html = ROUTES[path](q);
  else if (path.startsWith('/patient/')) html = viewPatient(path.slice(9), q);
  else if (path.startsWith('/stage/')) html = viewStage(path.slice(7), q);
  else if (STAGE_ROUTES[path]) html = viewStage(STAGE_ROUTES[path], q);
  else html = viewDashboard(q);
  const root = document.getElementById('root');
  root.innerHTML = shell(html, path) + mockBar();
  root.style.height = '100%';

  const viewOf = v => { state.viewOf = v||null; render(); toast(state.viewOf ? `Looking at ${state.access.find(x=>x.key===state.viewOf).name}'s view` : 'Back to your own view'); };

  bind('layoutSel', 'change', e => { state.layout = e.target.value; persistAll(); render(); toast(e.target.value==='current'?'Showing the app as it is today':'Redesign: search header on every page'); });

  if (sm) { sm.addEventListener('keydown', e => { if(e.key==='Enter') go('/system-mgmt', {tab:'search', q:sm.value.trim()}); }); if(q.q) { sm.focus(); sm.setSelectionRange(sm.value.length, sm.value.length); } }

  if (ov) {
    ov.addEventListener('input', () => renderOvDrop(ov.value));

    ov.addEventListener('keydown', e => {
      const rows = [...document.querySelectorAll('#ovDrop .gs-row')]; const cur = rows.findIndex(r=>r.classList.contains('hi'));
      if (e.key==='ArrowDown' && rows.length) { e.preventDefault(); rows.forEach(r=>r.classList.remove('hi')); rows[(cur+1)%rows.length].classList.add('hi'); }
      else if (e.key==='ArrowUp' && rows.length) { e.preventDefault(); rows.forEach(r=>r.classList.remove('hi')); rows[(cur-1+rows.length)%rows.length].classList.add('hi'); }
      else if (e.key==='Enter') { const r = rows[cur>=0?cur:0]; if (r) location.hash = r.getAttribute('data-nav'); }

    });
  }
  // global search: suggestions as you type, arrow keys + Enter, Esc closes
  const gs = document.getElementById('gsInput');
  if (gs) {
    if (state.gsValue) { gs.value = state.gsValue; }
    gs.addEventListener('input', () => { state.gsValue = gs.value; renderSearchDrop(gs.value); });
    gs.addEventListener('focus', () => { if (gs.value) renderSearchDrop(gs.value); });
    gs.addEventListener('keydown', e => {
      const rows = [...document.querySelectorAll('#gsDrop .gs-row')]; const cur = rows.findIndex(r=>r.classList.contains('hi'));
      if (e.key==='ArrowDown' && rows.length) { e.preventDefault(); rows.forEach(r=>r.classList.remove('hi')); rows[(cur+1)%rows.length].classList.add('hi'); }
      else if (e.key==='ArrowUp' && rows.length) { e.preventDefault(); rows.forEach(r=>r.classList.remove('hi')); rows[(cur-1+rows.length)%rows.length].classList.add('hi'); }
      else if (e.key==='Enter') { const r = rows[cur>=0?cur:0]; if (r) { state.gsValue=''; location.hash = r.getAttribute('data-nav'); } }
      else if (e.key==='Escape') { gs.value=''; state.gsValue=''; renderSearchDrop(''); gs.blur(); }
    });
  }
}

document.addEventListener('click', e => {

  if (nav) { e.preventDefault(); let h = nav.getAttribute('data-nav'); if(!h.startsWith('#')) h = '#'+h; if (nav.classList.contains('gs-row')) state.gsValue=''; if (location.hash === h) render(); else location.hash = h; return; }

  else if (a==='ucvisit') { const p = P(state.ucPatient); const v = state.ucVisit; state.ucVisit = ''; state._keepScroll = true; render(); toast(`MN Expiry updated to ${v} + 6 months for ${p?p.name:'patient'} · Medical Records → MR Valid (mock)`); }
  else if (a==='ucattach') { toast('Fax attached to the Monday item as clinicals (mock — nothing is written)'); }
  else if (a==='ucsubmit') { const p = P(act.getAttribute('data-v')); state.ucPatient = null; state._keepScroll = true; render(); toast(`${p?p.name:'Patient'} sent back to Evaluate — due today (mock — nothing is written)`); }
  else if (a==='sidenum') { state.sideNum = act.getAttribute('data-v'); state.sideTab = 'texts'; state._keepScroll = true; render(); }
  else if (a==='callalt') { toast(`Calls ${act.getAttribute('data-v')} through RingCentral (mock)`); }
  else if (a==='addnote') { const el = document.getElementById('subNoteInput'); const txt = el ? el.value.trim() : ''; if (!txt) { toast('Write the note first'); return; } const p = P(act.getAttribute('data-v')); if (p) { const d = new Date(); const when = d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); const initials = (me().name||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'MM'; p.subNotes = [{who:initials, when, text:txt}].concat(p.subNotes||[]); } state._keepScroll = true; render(); toast('Note posted to the Subscription Patient Notes column (mock — nothing is written)'); }
  else if (a==='resend') { toast('Texts the reorder link to the patient (mock — nothing is sent)'); }
  else if (a==='swapcancel') { state.swapOpen = null; state._keepScroll=true; render(); }
  else if (a==='swapsend') { const v=act.getAttribute('data-v'); const to=(document.getElementById('swapTo')||{}).value||''; const qty=(document.getElementById('swapQty')||{}).value||''; state.swapSent = state.swapSent||{}; state.swapSent[v] = {to, qty, from: state.swapItem||''}; state.swapOpen = null; state._keepScroll=true; render(); toast(`Swap emailed to Cardinal — ${qty} × ${to} (mock — nothing is sent)`); }
  else if (a==='filev') { toast('Opens the file from the Monday item in a new tab'); }
  else if (a==='save') { state.dirty = false; state._keepScroll = true; render(); toast('Saved to the Subscription board (mock — nothing is written)'); }
  else if (a==='discard') { state.dirty = false; state._keepScroll = true; render(); toast('Edits discarded'); }
  else if (a==='faxsend') { toast('Attaches this fax as clinicals and re-opens Medical Evaluation at Evaluate MN for the matched patient'); }
  else if (a==='filed') { toast('Downloads the file'); }
  else if (a==='ovact') { toast(`${act.getAttribute('data-o')} — same Oversight action as today (writes to the board)`); }
  else if (a==='sidetab') { state.sideTab=act.getAttribute('data-v'); state._keepScroll=true; render(); }
  else if (a==='callfilter') { state.callFilter=act.getAttribute('data-v'); state._keepScroll=true; render(); }
  else if (a==='play') { const v=act.getAttribute('data-v'); state.playing = state.playing===v ? null : v; state._keepScroll=true; render(); if (state.playing) toast('Plays the RingCentral recording in the live app'); }
  else if (a==='heard') { toast('Marks the voicemail heard in RingCentral'); }
  else if (a==='transcript') { toast('Opens the RingCentral call transcript'); }
  else if (a==='booking') { toast('Sends the Calendly intake-call link by text or email, with a prefilled message'); }
  else if (a==='log') { toast(`Logged "${act.getAttribute('data-o')}" — note stamped with your initials, attempt counter +1 on the board`); }
  else if (a==='home') { const k=act.getAttribute('data-k'), v=act.getAttribute('data-v'); const p=state.access.find(x=>x.key===k); let arr=homeViewsOf(p).slice(); if (arr.includes(v)) { if (arr.length===1) { toast('Everyone needs at least one view'); return; } arr=arr.filter(x=>x!==v); } else arr.push(v); p.homeView=arr; const q=PEOPLE.find(x=>x.key===k); if(q) q.homeView=arr.slice(); state._keepScroll=true; render(); toast(`${p.name}'s view is now ${viewLabel(p)} — switch "viewing as" to see it`); }
  else if (a==='hometab') { state.homeTab[act.getAttribute('data-k')]=act.getAttribute('data-v'); state._keepScroll=true; render(); }
  else if (a==='viewof') { e.preventDefault(); state.viewOf = act.getAttribute('data-v')||null; render(); }
  else if (a==='accent') { state.accent = act.getAttribute('data-v'); persistAll(); state._keepScroll=true; if (act.closest('#settingsMenu')) state._openMenu='settingsMenu'; render(); }
  else if (a==='bell') { const p=act.parentElement.querySelector('#bellPop'); p.classList.toggle('hidden'); e.stopPropagation(); }
  else if (a==='tools') { const p=document.getElementById('toolsPop'); p.classList.toggle('hidden'); e.stopPropagation(); }
  else if (a==='report') { toast('Opens the josh-tec-requests form in the live app'); }
  else if (a==='role') { const p=state.access.find(x=>x.key===act.getAttribute('data-k')); const r=act.getAttribute('data-r'); const i=p.roles.indexOf(r); if(i>=0) p.roles.splice(i,1); else p.roles.push(r); state._keepScroll = true; render(); }
  else if (a==='answers') { const p=state.access.find(x=>x.key===act.getAttribute('data-k')); p.answers=!p.answers; state._keepScroll = true; render(); }
  else if (a==='mgr') { const p=state.access.find(x=>x.key===act.getAttribute('data-k')); if(!p.you){ p.manager=!p.manager; const q=PEOPLE.find(x=>x.key===p.key); if(q) q.manager=p.manager; state._keepScroll = true; render(); } }
  else if (a==='perm') { const p=state.access.find(x=>x.key===act.getAttribute('data-k')); const f=act.getAttribute('data-f'); if (f==='admin' && p.you && p.admin) { toast("You can't remove your own admin access"); return; } p[f]=!p[f]; const q=PEOPLE.find(x=>x.key===p.key); if(q) q[f]=p[f]; state._keepScroll = true; render(); const L={comms:'patient communication',adjustOrders:'adjust orders',answers:'answers calls',admin:'admin',viewOthers:"view others' views",reports:'reports & metrics',inventory:'inventory',editProfile:'edit profile'}; toast(`${p.name}: ${L[f]||f} ${p[f]?'on':'off'} — switch "viewing as" to see the effect`); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-setting]'); if (!el) return; state.settings[el.getAttribute('data-setting')] = el.value; persistAll(); toast('Saved'); });
// any edit on the patient profile: nothing is written until Save — show the warning bar and light up Save
const markDirty = e => { if (!e.target.closest('.pt-main') || e.target.closest('.composer') || e.target.closest('.notes-mini') || e.target.closest('.swap-panel') || e.target.closest('.subnotes') || e.target.id==='gsInput') return; state.dirty = true; const b = document.getElementById('dirtyBar'); if (b) b.classList.remove('hidden'); const sv = document.getElementById('saveBtn'); if (sv) sv.classList.add('pulse'); };
document.addEventListener('input', markDirty); document.addEventListener('change', markDirty);
document.addEventListener('keydown', e => {
  if (e.key==='/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { const gs=document.getElementById('gsInput'); if (gs) { e.preventDefault(); gs.focus(); } }
});
window.addEventListener('hashchange', render);
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benefits · Redesign</title>
<style>
/* ============ design tokens (Medical Evaluation UI Design v2) ============ */
:root{
  --background:oklch(1 0 0);
  --foreground:oklch(0.129 0.042 264.695);
  --card:oklch(1 0 0);
  --muted:oklch(0.968 0.007 247.896);
  --muted-foreground:oklch(0.554 0.046 257.417);
  --border:oklch(0.929 0.013 255.508);
  --input:oklch(0.929 0.013 255.508);
  /* Medically Modern palette */
  --mm-teal:oklch(0.36 0.04 200);
  --mm-green:oklch(0.62 0.10 175);
  --mm-green-12:oklch(0.62 0.10 175 / 0.12);
  --mm-mint:oklch(0.94 0.02 175);
  --mm-mint-ring:oklch(0.85 0.04 175);
  --mm-rose:oklch(0.62 0.13 18);
  --mm-rose-soft:oklch(0.94 0.03 18);
  --mm-amber:oklch(0.66 0.12 75);
  --mm-amber-soft:oklch(0.96 0.04 90);
  --mm-sky:oklch(0.60 0.10 230);
  --mm-sky-soft:oklch(0.95 0.02 230);
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--background);color:var(--foreground);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
.page{max-width:120rem;margin:0 auto;padding:40px 32px;display:flex;flex-direction:column;gap:24px}

/* ============ cards ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.step-card{border-left:4px solid var(--mm-green)}
.header-card{border-top:4px solid var(--mm-teal)}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.step-num{
  display:grid;place-items:center;height:36px;width:36px;border-radius:50%;
  font-size:1rem;font-weight:700;background:var(--mm-green-12);color:var(--mm-teal);
  box-shadow:inset 0 0 0 1px var(--mm-mint-ring);flex-shrink:0;
}
.step-num.done{background:var(--mm-green);color:#fff;box-shadow:none}
.step-head h2{font-size:1.25rem;font-weight:700;letter-spacing:-.015em}
.step-sub{font-size:.9rem;color:var(--muted-foreground);margin:0 0 20px 48px}
.step-chip{margin-left:auto;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--muted);color:var(--muted-foreground)}
.step-chip.ok{background:var(--mm-mint);color:var(--mm-teal)}

/* ============ typography helpers ============ */
.eyebrow{font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
/* copy-friendly values: double-click (or single click-drag) selects the WHOLE value, never the label */
.hval,.sval,.ph-name,.sel{user-select:all;-webkit-user-select:all}
.demo-tag{
  display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;
  font-size:.62rem;font-weight:700;letter-spacing:.05em;vertical-align:middle;
  background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3);
}
.eyebrow-xs{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.hval{margin-top:4px;font-size:1.125rem;font-weight:600}

/* ============ top bar ============ */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:1.875rem;font-weight:900;letter-spacing:-.025em;color:var(--mm-teal)}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:9px 16px;
  font-size:.875rem;font-weight:600;border:1px solid var(--border);background:var(--card);
  color:var(--mm-teal);box-shadow:0 1px 2px rgb(0 0 0 / .05);transition:all .12s;
}
.tbtn:hover{border-color:var(--mm-mint-ring);background:oklch(0.973 0.011 175)}
.tbtn.solid{background:var(--mm-green);border-color:transparent;color:#fff}
.tbtn.solid:hover{background:oklch(0.56 0.10 175)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}

/* ============ demo bar ============ */
.demo-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-bottom:-8px;flex-wrap:wrap}
.demo-bar .lbl{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.demo-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;background:oklch(0.968 0.007 247.896 / 0.4);flex-wrap:wrap}
.demo-seg button{font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:6px;color:var(--muted-foreground)}
.demo-seg button.on{background:var(--card);color:var(--mm-teal);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.reset-link{font-size:.8rem;font-weight:600;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:3px}
.reset-link:hover{color:var(--foreground)}

/* ============ patient header ============ */
.ph-name{font-size:1.875rem;font-weight:900;letter-spacing:-.025em}
.ph-dob{margin-top:4px;font-size:1.125rem;color:var(--muted-foreground)}
.ph-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.hgroup{border:1px solid var(--border);border-radius:12px;background:oklch(0.968 0.007 247.896 / 0.3);padding:16px}
.hgroup .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
/* keep top-row labels one line + equal height so controls/values align across groups */
.ph-groups .eyebrow{font-size:.78rem;white-space:nowrap;display:flex;align-items:center;gap:6px;height:18px}
.ph-groups .hval{margin-top:6px;min-height:38px;display:flex;align-items:center}
.ph-groups select{margin-top:6px}
.ph-toggle{
  margin-top:20px;display:inline-flex;align-items:center;gap:6px;
  font-size:1.125rem;font-weight:600;color:var(--mm-teal);
}
.ph-toggle:hover{opacity:.8}
.ph-toggle svg{transition:transform .2s}
.ph-toggle.open svg{transform:rotate(180deg)}
.ph-details{margin-top:20px;border-top:1px solid var(--border);padding-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* ============ stedi check output (read-only) ============ */
.stedi-block{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:16px;background:oklch(0.968 0.007 247.896 / 0.2)}
.stedi-head{margin-bottom:12px}
.stedi-grid{display:grid;gap:10px}
.stedi-grid+.stedi-grid{margin-top:10px}
.stedi-grid.three{grid-template-columns:repeat(3,1fr)}
.stedi-grid.four{grid-template-columns:repeat(4,1fr)}
.stedi-grid.five{grid-template-columns:repeat(5,1fr)}
.sbox{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px 14px}
.sval{margin-top:2px;font-size:.95rem;font-weight:500}
.sval.strong{font-weight:700}
.cs-row{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.cs-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;background:var(--card)}
.cs-toggle button{font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:6px;color:var(--muted-foreground)}
.cs-toggle button.on{background:var(--mm-green-12);color:var(--mm-teal)}

/* ============ who-to-call suggestion pills (matches profile-sendoff sugg-chip2) ============ */
.sugg-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.sugg-lead2{font-size:.8rem;font-weight:800;color:var(--foreground)}
.sugg-chip2{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--mm-green-12);color:var(--mm-teal);box-shadow:inset 0 0 0 1px var(--mm-mint-ring)}
.sugg-chip2 .ph{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;user-select:all;-webkit-user-select:all}
.sugg-chip2.office{background:var(--mm-teal);color:#fff;box-shadow:none}
.sugg-chip2.office .ph{color:#fff}
.sugg-note{font-size:.8rem;color:var(--muted-foreground)}
.head-pills{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.head-pills:empty{display:none}
#s2-pills{margin-left:auto}
.uc-pill{margin-top:12px}
.uc-pill .sugg-lead2{margin-right:8px}
.pos-flag{
  margin-top:14px;display:flex;align-items:flex-start;gap:10px;
  border:1px solid oklch(0.66 0.12 75 / 0.5);border-radius:10px;
  background:oklch(0.96 0.04 90 / 0.6);padding:12px 16px;
  font-size:.9rem;color:oklch(0.42 0.10 75);line-height:1.5;
}
.pos-flag svg{flex-shrink:0;margin-top:2px}
.pos-flag b{color:oklch(0.38 0.10 75)}
@media (max-width:1150px){
  .stedi-grid.five{grid-template-columns:repeat(2,1fr)}
  .stedi-grid.three,.stedi-grid.four{grid-template-columns:repeat(2,1fr)}
}

select,input[type=date],input[type=text],input[type=number],textarea{
  font:inherit;font-size:.875rem;width:100%;height:38px;padding:0 12px;
  border:1px solid var(--input);border-radius:6px;background:var(--background);color:var(--foreground);
}
textarea{height:auto;padding:10px 12px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--mm-green);outline-offset:1px}
.flabel{margin-bottom:6px;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.fhint{margin-top:6px;font-size:.75rem;color:var(--muted-foreground)}
.req-star{color:var(--mm-rose);font-weight:700}

/* ============ universal checks ============ */
.uc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.subcard{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:20px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);transition:background .2s,border-color .2s}
.subcard.ok{background:oklch(0.973 0.011 175);border-color:var(--mm-mint-ring)}
.subcard.bad{background:oklch(0.62 0.13 18 / 0.05);border-color:oklch(0.62 0.13 18 / 0.35)}
.uc-title{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.uc-grid .subcard{display:flex;flex-direction:column;padding:18px}
.uc-grid .seg{margin-top:auto;padding-top:16px}
.uc-grid .seg button{white-space:nowrap;padding:10px 8px}
.uc-tag{font-size:.7rem;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);letter-spacing:.05em}

/* ============ segmented buttons ============ */
.seg{display:inline-flex;width:100%;gap:8px;margin-top:14px}
.seg button{
  flex:1;padding:10px 12px;font-size:.875rem;font-weight:600;border-radius:6px;
  border:2px solid var(--border);background:var(--background);color:var(--muted-foreground);
  transition:all .12s;
}
.seg button.g:not(.sel-g):hover{color:var(--mm-green);border-color:var(--mm-green);background:var(--mm-green-12)}
.seg button.r:not(.sel-r):hover{color:var(--mm-rose);border-color:var(--mm-rose);background:oklch(0.62 0.13 18 / 0.12)}
.seg button.a:not(.sel-a):hover{color:var(--mm-amber);border-color:var(--mm-amber);background:oklch(0.66 0.12 75 / 0.12)}
.seg button.s:not(.sel-s):hover{color:var(--mm-sky);border-color:var(--mm-sky);background:oklch(0.60 0.10 230 / 0.10)}
.seg button.sel-g{border-color:transparent;background:var(--mm-green);color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.seg button.sel-r{border-color:transparent;background:var(--mm-rose);color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.seg button.sel-a{border-color:transparent;background:var(--mm-amber);color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.seg button.sel-s{border-color:transparent;background:var(--mm-sky);color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

/* ============ product cards ============ */
.prod-list{display:flex;flex-direction:column;gap:16px}
.prod-card{border:1px solid var(--border);border-left:4px solid var(--mm-mint-ring);border-radius:12px;background:var(--card);padding:20px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.prod-card.recurring{border-left-color:var(--mm-green)}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prod-title{font-size:1.125rem;font-weight:700;letter-spacing:-.01em}
.prod-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.chip.rec{background:var(--mm-green-12);color:var(--mm-teal)}
.chip.one{background:var(--muted);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.chip.grp{background:transparent;color:var(--muted-foreground);padding:3px 2px}
.chip.mcd{background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3)}
.hcpc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;color:var(--muted-foreground);margin-top:2px}
.hcpc b{color:var(--mm-teal);font-weight:700}
.prod-note{margin-top:8px;font-size:.8rem;color:var(--muted-foreground);max-width:52rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.pending{background:var(--muted);color:var(--muted-foreground)}
.pill.clear{background:var(--mm-mint);color:var(--mm-teal);box-shadow:inset 0 0 0 1px var(--mm-mint-ring)}
.pill.warn{background:var(--mm-amber-soft);color:oklch(0.5 0.11 75);box-shadow:inset 0 0 0 1px oklch(0.66 0.12 75 / 0.35)}
.pill.rose{background:var(--mm-rose-soft);color:var(--mm-rose);box-shadow:inset 0 0 0 1px oklch(0.62 0.13 18 / 0.3)}
.prod-grid{display:grid;grid-template-columns:2fr 3fr;gap:24px;margin-top:16px}
.prod-q{border:1px solid var(--border);border-radius:10px;background:oklch(0.968 0.007 247.896 / 0.4);padding:16px 18px}
.prod-q .flabel{color:var(--mm-teal);font-weight:700}
.prod-grid .seg{margin-top:8px}
.autofill-note{margin-top:10px;font-size:.78rem;color:var(--mm-sky);font-weight:500}
.lastbill{
  margin-top:14px;border:1px solid oklch(0.66 0.12 75 / 0.4);border-radius:10px;
  background:oklch(0.96 0.04 90 / 0.5);padding:14px 16px;
}
.lastbill .flabel{color:oklch(0.5 0.11 75)}
.lastbill input{max-width:220px;background:var(--background);border-color:oklch(0.66 0.12 75 / 0.4)}
.lb-warn{
  margin-top:10px;border:1px solid oklch(0.66 0.12 75 / 0.55);border-radius:8px;
  background:oklch(0.96 0.04 90);padding:10px 14px;font-size:.83rem;
  color:oklch(0.42 0.10 75);line-height:1.5;
}
.lb-warn b{color:oklch(0.42 0.10 75)}
.dvs-note{
  margin-top:16px;display:flex;align-items:flex-start;gap:12px;
  border:1px solid var(--mm-mint-ring);border-radius:12px;
  background:oklch(0.94 0.02 175 / 0.5);padding:16px 18px;
  font-size:.95rem;color:var(--mm-teal);line-height:1.55;
}
.dvs-note svg{flex-shrink:0;margin-top:2px}
.dvs-note b{font-weight:700}
.empty-box{border:2px dashed var(--mm-mint-ring);border-radius:12px;background:oklch(0.94 0.02 175 / 0.25);padding:36px;text-align:center}
.empty-box p{font-size:.95rem;color:var(--mm-teal);font-weight:600}
.empty-box .sub{margin-top:6px;font-size:.85rem;color:var(--muted-foreground);font-weight:400;max-width:34rem;margin-left:auto;margin-right:auto}

/* ============ product code labels ============ */
.prod-code{font-size:1.4rem;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mm-teal);letter-spacing:-.01em}
.prod-name{font-size:.9rem;font-weight:600;color:var(--muted-foreground);margin-top:1px}

/* ============ SoS billing entry ============ */
/* bottom-align the answer rows across both question boxes */
.prod-q{display:flex;flex-direction:column}
.prod-q>.seg{margin-top:auto}
.sos-grid{display:flex;align-items:flex-end;gap:12px;margin-top:auto}
.sos-pair{
  flex:1;display:grid;grid-template-columns:minmax(140px,1fr) 90px;gap:10px;
  border:1.5px dashed var(--border);border-radius:10px;background:var(--card);padding:10px 12px;
}
.sos-pair.locked{opacity:.5}
.slab{margin-bottom:5px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-foreground);white-space:nowrap}
.sos-grid input:disabled{cursor:not-allowed;background:var(--muted)}
.sos-or{
  display:grid;place-items:center;height:30px;width:30px;border-radius:50%;flex-shrink:0;
  background:var(--muted);font-size:.68rem;font-weight:800;color:var(--muted-foreground);letter-spacing:.02em;
  margin-bottom:14px;
}
.sos-toggle{margin-bottom:10px}
.prod-q.off{opacity:.45;pointer-events:none}
.prod-q.off .fhint{font-weight:600}
.sos-toggle{
  height:38px;padding:0 14px;font-size:.85rem;font-weight:600;border-radius:6px;
  border:2px solid var(--border);background:var(--background);color:var(--muted-foreground);transition:all .12s;white-space:nowrap;
}
.sos-toggle.nv:not(.on):hover{color:var(--mm-sky);border-color:var(--mm-sky);background:var(--mm-sky-soft)}
.sos-toggle.nv.on{border-color:transparent;background:var(--mm-sky);color:#fff}
.sos-toggle.sk:not(.on):not(:disabled):hover{color:var(--mm-teal);border-color:var(--mm-teal);background:var(--mm-green-12)}
.sos-toggle.sk.on{border-color:transparent;background:var(--mm-teal);color:#fff}
.sos-toggle:disabled{opacity:.35;cursor:not-allowed}

/* ============ call logs ============ */
.call-log{margin-top:18px;border-top:1px dashed var(--border);padding-top:14px}
.cl-head{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mm-teal);margin-bottom:10px}
.cl-row{display:grid;grid-template-columns:150px 1fr 32px;gap:10px;margin-bottom:10px;align-items:center}
.cl-row input{height:38px}
.cl-del{
  display:grid;place-items:center;height:32px;width:32px;border-radius:8px;
  color:var(--muted-foreground);font-size:.8rem;transition:all .12s;
}
.cl-del:hover{background:var(--mm-rose-soft);color:var(--mm-rose)}
.cl-add{
  display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;
  color:var(--mm-teal);border:1.5px dashed var(--mm-mint-ring);border-radius:8px;
  padding:7px 14px;transition:all .12s;
}
.cl-add:hover{background:oklch(0.973 0.011 175)}

/* ============ monday preview ============ */
.mon-box{border:1px solid var(--border);border-radius:12px;background:oklch(0.968 0.007 247.896 / 0.3);padding:20px}
.mon-box h3{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.mon-box .msub{font-size:.8rem;color:var(--muted-foreground);margin-top:2px;margin-bottom:14px}
.mon-rows{border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden}
.mon-row{display:grid;grid-template-columns:240px 1fr;align-items:center;gap:12px;padding:10px 16px}
.mon-row + .mon-row{border-top:1px solid var(--border)}
.mon-row .mlabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
.mval{display:inline-flex;width:fit-content;align-items:center;padding:3px 10px;border-radius:6px;font-size:.875rem;font-weight:600}
.mval.good{background:var(--mm-mint);color:var(--mm-teal)}
.mval.warn{background:var(--mm-amber-soft);color:oklch(0.5 0.11 75)}
.mval.bad{background:var(--mm-rose-soft);color:var(--mm-rose);box-shadow:inset 0 0 0 1px oklch(0.62 0.13 18 / 0.3)}
.mval.skip{background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3)}
.mval.neutral{background:transparent;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;padding-left:0}
.mon-note{margin-top:10px;font-size:.78rem;color:var(--muted-foreground);font-style:italic}

/* ============ footer actions ============ */
.foot-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:20px}
.foot-left{display:flex;gap:10px;flex-wrap:wrap}
.obtn{
  display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 18px;
  font-size:.875rem;font-weight:600;border:2px solid var(--border);background:var(--card);
  color:var(--muted-foreground);transition:all .12s;
}
.obtn.rose{border-color:oklch(0.62 0.13 18 / 0.4);color:var(--mm-rose)}
.obtn.rose:hover{background:var(--mm-rose-soft)}
.obtn.rose.on{background:var(--mm-rose);border-color:transparent;color:#fff}
.obtn.sky{border-color:oklch(0.60 0.10 230 / 0.4);color:var(--mm-sky)}
.obtn.sky:hover{background:var(--mm-sky-soft)}
.obtn.sky.on{background:var(--mm-sky);border-color:transparent;color:#fff}
.send-btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:8px;
  background:var(--mm-green);color:#fff;font-size:1rem;font-weight:600;
  padding:13px 26px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .1);
}
.send-btn:hover{background:oklch(0.56 0.10 175)}
.send-btn:disabled{background:oklch(0.85 0.01 200);box-shadow:none;cursor:not-allowed}
.missing-box{
  margin-top:14px;border:1px solid oklch(0.66 0.12 75 / 0.45);border-radius:10px;
  background:oklch(0.96 0.04 90 / 0.5);padding:12px 18px;text-align:center;
}
.missing-box .mb-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.11 75)}
.missing-box .mb-list{margin-top:4px;font-size:.85rem;color:oklch(0.45 0.1 75)}

/* ============ modals & toast ============ */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgb(0 0 0 / .2);width:100%;max-width:30rem;padding:24px}
.modal h3{font-size:1.15rem;font-weight:800;letter-spacing:-.015em;color:var(--mm-teal)}
.modal .msub{font-size:.85rem;color:var(--muted-foreground);margin-top:2px;margin-bottom:16px}
.modal .m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--mm-teal);color:#fff;border-radius:10px;padding:12px 18px;
  font-size:.875rem;font-weight:600;box-shadow:0 8px 24px rgb(0 0 0 / .2);
  animation:tin .2s ease-out;
}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ============ layout: main + notes rail ============ */
.layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,22vw,420px);gap:24px;align-items:start}
.main-col{display:flex;flex-direction:column;gap:24px;min-width:0}
.notes-rail{position:sticky;top:16px;height:75vh}
.notes-card{display:flex;flex-direction:column;padding:20px;height:100%}
.notes-card textarea{flex:1;min-height:0;resize:none;font-size:.9rem;line-height:1.6}
@media (max-width:1150px){
  .layout{grid-template-columns:1fr}
  .notes-rail{position:static}
  .notes-card textarea{height:auto;min-height:140px}
}

/* ============ clinicals dropdown ============ */
.clin-wrap{position:relative}
.clin-count{
  display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;background:var(--mm-green);color:#fff;font-size:.72rem;font-weight:700;
}
.clin-dd{
  display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:22rem;
  background:var(--card);border:1px solid var(--border);border-radius:12px;

.clin-file{

.clin-file:hover{background:oklch(0.973 0.011 175)}
.clin-file svg{flex-shrink:0;color:var(--mm-teal)}
.clin-file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.clin-all{
  margin-top:6px;border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:center;
}

/* ============ monday drawer toggle ============ */
.mon-toggle{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;

}
.mon-toggle h2{font-size:1.25rem;font-weight:700;letter-spacing:-.015em}
.mon-toggle-hint{margin-left:auto;font-size:.85rem;font-weight:500;color:var(--muted-foreground)}

<script>
/* =====================================================================
   LOGIC PORT — mirrors src/lib/samantha/hcpcRules.ts + workflow.ts and
   src/components/samantha/InsurancePanel.tsx from command-center-app.
   UI-only: nothing here talks to Monday.
   ===================================================================== */

/* ---------- hcpcRules.ts ---------- */
const MONITOR_HCPC='E2103', SENSORS_HCPC='A4239', PUMP_HCPC='E0784';
const SUPPLY_GROUPS={
  A:{infusion_set:'A4230',cartridge:'A4232'},
  B:{infusion_set:'A4224',cartridge:'A4225'},
  C:{infusion_set:'A4231',cartridge:'A4232'},
};
const GROUP_BY_PAYER={
  'Fidelis Medicaid':'A','Fidelis Low-Cost':'A','Fidelis Commercial':'A',
  'Anthem BCBS Commercial':'A','Anthem BCBS Medicaid (JLJ)':'A','Anthem BCBS Low-Cost (JLJ)':'A',
  'United Medicaid':'A','United Commercial':'A','United Low-Cost':'A',
  'Horizon BCBS':'A','BCBS TN':'A','BCBS FL':'A','BCBS WY':'A',
  'Medicaid':'A','Oregon Care':'A','MagnaCare':'A','UMR':'A',
  'Anthem BCBS Medicare':'B','Fidelis Medicare':'B','Medicare A&B':'B','NYSHIP':'B',
  'United Medicare':'B','Wellcare':'B','Humana':'B','Cigna':'B','Midlands Choice':'B',
  'Aetna Commercial':'C','Aetna Medicare':'C',
};
const PRIMARY_OPTIONS=[
  'Fidelis Medicaid','Fidelis Low-Cost','Fidelis Commercial','Fidelis Medicare',
  'Anthem BCBS Medicare','Anthem BCBS Commercial','Anthem BCBS Medicaid (JLJ)','Anthem BCBS Low-Cost (JLJ)',
  'Horizon BCBS','BCBS TN','BCBS FL','BCBS WY',
  'United Medicare','United Medicaid','United Commercial','United Low-Cost',
  'Aetna Medicare','Aetna Commercial',
  'Medicare A&B','Medicaid','NYSHIP',
  'Cigna','Humana','Wellcare','Midlands Choice','MagnaCare','UMR','Oregon Care',
];
const SECONDARY_OPTIONS=['None','NY Medicaid','Medicare Supplement'];
const SERVING_OPTIONS=['Supplies Only','CGM','Insulin Pump','Supplies + CGM','Insulin Pump + CGM'];
const SERVING_PRODUCTS={
  'Supplies Only':['infusion_set','cartridge'],
  'CGM':['monitor','sensors'],
  'Insulin Pump':['insulin_pump','infusion_set','cartridge'],
  'Supplies + CGM':['monitor','sensors','infusion_set','cartridge'],
  'Insulin Pump + CGM':['monitor','sensors','insulin_pump','infusion_set','cartridge'],
};
const NEEDS_NY_MEDICAID_SECONDARY=new Set(['Fidelis Medicaid','Anthem BCBS Medicaid (JLJ)']);

function suppliesRouteToMedicaid(primary,secondary){
  if(primary==='Medicaid')return true;
  if(NEEDS_NY_MEDICAID_SECONDARY.has(primary)){
    return (secondary??'').trim().toLowerCase()==='ny medicaid';
  }
  return false;
}
function resolveHcpcs(primary,serving,secondary){
  if(!primary||!serving)return[];
  const products=SERVING_PRODUCTS[serving];
  if(!products)return[];
  const toMedicaid=suppliesRouteToMedicaid(primary,secondary);
  const suppliesPayer=toMedicaid?'Medicaid':primary;
  const grp=GROUP_BY_PAYER[suppliesPayer];
  return products.map(product=>{
    switch(product){
      case 'monitor':      return{product,hcpc:MONITOR_HCPC,billsTo:'primary'};
      case 'sensors':      return{product,hcpc:SENSORS_HCPC,billsTo:'primary'};
      case 'insulin_pump': return{product,hcpc:PUMP_HCPC,billsTo:'primary'};
      case 'infusion_set': return grp?{product,hcpc:SUPPLY_GROUPS[grp].infusion_set,billsTo:toMedicaid?'medicaid':'primary',group:grp}
                                     :{product,hcpc:'Evaluate',billsTo:toMedicaid?'medicaid':'primary'};
      case 'cartridge':    return grp?{product,hcpc:SUPPLY_GROUPS[grp].cartridge,billsTo:toMedicaid?'medicaid':'primary',group:grp}
                                     :{product,hcpc:'Evaluate',billsTo:toMedicaid?'medicaid':'primary'};
    }
  });
}
const isAutoFilledMedicaidSupply=r=>(r.product==='infusion_set'||r.product==='cartridge')&&r.billsTo==='medicaid';
const PRODUCT_LABELS={monitor:'CGM Monitor',sensors:'CGM Sensors',insulin_pump:'Insulin Pump',infusion_set:'Infusion Sets',cartridge:'Cartridges'};

  'pump':{group:'Pump',name:'Insulin Pump',cadence:'ONE-TIME',

  'infusion-sets':{group:'Pump',name:'Infusion Sets',cadence:'RECURRING',

};

/* SoS lookback — 4 yr for pump & monitor; 90 days for sensors/supplies (60 with Medicaid) */
function patientHasMedicaid(){
  return (P.primary??'').toLowerCase().includes('medicaid')||
    ((P.secondary==='None'?'':P.secondary)??'').toLowerCase().includes('medicaid');
}
function sosLookbackDays(codeId){
  if(codeId==='pump'||codeId==='cgm-monitor')return 365*4;
  return patientHasMedicaid()?60:90;
}
function sosClearBeforeDate(codeId){
  const days=sosLookbackDays(codeId);
  const d=new Date();d.setDate(d.getDate()-days);
  const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  const label=days>=365?'4 yr lookback':`${days} day lookback${days===60?' — Medicaid':''}`;
  return{date:`${mm}/${dd}/${d.getFullYear()}`,iso:d.toISOString().slice(0,10),days,label};
}
/* Next Order Date offset per product (matches computeNextOrderDates) */
function nextOrderOffsetDays(codeId){
  if(codeId==='pump')return 365*4;
  if(codeId==='cgm-sensors')return 90;
  if(codeId==='infusion-sets'||codeId==='cartridges')return patientHasMedicaid()?60:90;
  return null; /* cgm-monitor has no next-order column */
}
function addDaysToDate(dateStr,days){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime()))return'';
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
const laterDate=(a,b)=>!a&&!b?'':!a?b:!b?a:(a>=b?a:b);
function fmtDate(s){
  if(!s)return'—';
  const d=new Date(s+'T00:00:00');
  if(isNaN(d.getTime()))return'—';
  return d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});
}

  setCode(codeId,{auth:cur.auth===v?'':v});

/* SoS entry — the rep records facts (last bill date + units, or Never
   Billed); clear/not-clear is DERIVED, never chosen. */
function updateBillEntry(codeId,patch){
  const cur={...code(codeId),...patch};
  cur.sosEntry=(cur.lastBill||cur.units)?'billed':'';
  S.codes[codeId]=cur;render();
}
function toggleNever(codeId){
  const cur=code(codeId);
  setCode(codeId,cur.sosEntry==='never'?{sosEntry:''}:{sosEntry:'never',lastBill:'',units:''});
}
/* Derived Same-or-Similar status (mirrors what the backend will compute):
   never billed → clear; date older than the product's lookback (4yr
   pump/monitor, 90d others, 60d Medicaid) → clear; date within the
   window → not-clear. SKIP is never chosen by the rep — it's derived:
   Auth = Required with no billing entry recorded → skip (defer until
   the auth resolves). Still lands on the board exactly like today. */
function derivedSos(codeId){
  const s=code(codeId);
  if(s.auth==='required')return 'skip'; /* SoS section disabled — always deferred */
  if(s.sosEntry==='never')return 'clear';
  if(s.sosEntry==='billed'&&s.lastBill){
    return s.lastBill<sosClearBeforeDate(codeId).iso?'clear':'not-clear';
  }
  return '';
}
function sosComplete(codeId){
  const s=code(codeId);
  if(s.auth==='required')return true; /* deferred — nothing to fill */
  if(s.sosEntry==='never')return true;
  if(s.sosEntry==='billed')return !!s.lastBill&&!!s.units;
  return false;
}

function deriveMondayColumns(resolved){
  const u=S.universal;
  const universalAllConfirmed=u['in-network']==='confirmed'&&u['active']==='confirmed'&&u['dme-benefits']==='confirmed';
  const anyUniversalNotConfirmed=Object.values(u).some(v=>v==='not-confirmed');
  const activeNetwork=(u['in-network']==='confirmed'&&u['active']==='confirmed')?'Active/In-network':'Stuck';
  const dmeBenefits=u['dme-benefits']==='confirmed'?'Yes':'Partial / No';

  const productStates=resolved.map(r=>{
    if(isAutoFilledMedicaidSupply(r))return{product:r.product,label:PRODUCT_LABELS[r.product],auth:'required',sos:'clear',complete:true};
    const cid=PID_TO_CODE[r.product];
    const s=code(cid);
    return{product:r.product,label:PRODUCT_LABELS[r.product],auth:s.auth,sos:derivedSos(cid),complete:sosComplete(cid)};
  });

  const allFilled=productStates.length>0&&productStates.every(p=>!!p.auth&&p.complete);
  const anyAuthRequired=productStates.some(p=>p.auth==='required');
  const allAuthsFilled=productStates.length>0&&productStates.every(p=>!!p.auth);
  const auth=!allAuthsFilled?'—':anyAuthRequired?'Auths Required':'No Auths Required';

  const anyNotClear=productStates.some(p=>p.sos==='not-clear');
  const anySkip=productStates.some(p=>p.sos==='skip');
  const pumpNotClear=productStates.some(p=>p.product==='insulin_pump'&&p.sos==='not-clear');
  const sosCol=!allFilled?'—':anyNotClear?'Partial / Not Clear':anySkip?'Skip':'All Clear';

  const notClearProducts=productStates.filter(p=>p.sos==='not-clear').map(p=>p.label).join(', ');
  const skipSosProducts=productStates.filter(p=>p.sos==='skip').map(p=>p.label).join(', ');

  let stageAdvancer;
  if(anyUniversalNotConfirmed||!universalAllConfirmed||!allFilled||pumpNotClear){stageAdvancer='Benefits / SoS';}
  else if(anyAuthRequired){stageAdvancer='Authorization';}
  else{stageAdvancer='Complete';}

  const shouldEscalate=anyUniversalNotConfirmed||pumpNotClear;
  const escalation=shouldEscalate?'Escalation Required':'—';

  return{activeNetwork,dmeBenefits,auth,sos:sosCol,
    notClearProducts:notClearProducts||'—',skipSosProducts:skipSosProducts||'—',
    stageAdvancer,escalation,allFilled,shouldEscalate,anyAuthRequired};
}

function computeNextOrderDates(){
  const pump=code('pump'),sensors=code('cgm-sensors'),is=code('infusion-sets'),cart=code('cartridges');
  const ip=pump.lastBill?addDaysToDate(pump.lastBill,365*4):'';
  const sn=sensors.lastBill?addDaysToDate(sensors.lastBill,90):'';
  const suppliesLast=laterDate(is.lastBill,cart.lastBill);
  const isMedicaid=(P.primary??'').toLowerCase().includes('medicaid')||
    ((P.secondary==='None'?'':P.secondary)??'').toLowerCase().includes('medicaid');
  const sp=suppliesLast?addDaysToDate(suppliesLast,isMedicaid?60:90):'';
  return{ip,sensors:sn,supplies:sp};
}

/* Never-billed roll-ups now derive straight from the SoS entries —
   the old Medicare-only billing-history questions are gone. */
function deriveNeverBilled(){
  const isMedicareAB=P.primary==='Medicare A&B';
  const isCarNever=code('infusion-sets').sosEntry==='never'&&code('cartridges').sosEntry==='never';
  const cgmNever=code('cgm-sensors').sosEntry==='never';
  return{
    isCar:isMedicareAB&&isCarNever?'Never Billed':null,
    cgm:isMedicareAB&&cgmNever?'Never Billed':null,
    pumpDateTbd:isMedicareAB&&isCarNever,
  };
}

function validateForSubmit(){
  const missing=[];
  for(const id of ['in-network','active','dme-benefits']){
    if(!S.universal[id])missing.push(UNIVERSAL_LABELS[id]);
  }
  for(const r of getVisible()){
    const cid=PID_TO_CODE[r.product];
    const s=code(cid);
    if(!s.auth)missing.push(`${r.hcpc} · Auth Requirements`);
    if(!sosComplete(cid))missing.push(`${r.hcpc} · Last Bill Date + Units, or Never Billed`);
  }
  return missing;
}

  const visible=getVisible();
  const ready=!!P.primary&&!!P.serving;
  const complete=ready&&visible.length>0&&visible.every(r=>{const cid=PID_TO_CODE[r.product];return !!code(cid).auth&&sosComplete(cid)});
  $('s2-num').className=`step-num ${complete?'done':''}`;
  $('s2-num').textContent=complete?'✓':'2';

  if(!ready){
    $('prod-area').innerHTML=`<div class="empty-box"><p>Select Serving and Primary Insurance to load the codes for this patient.</p></div>`;
  }else if(visible.length===0){
    $('prod-area').innerHTML=`
    <div class="empty-box">
      <p>No benefit check needed</p>
      <p class="sub">Everything this patient is served bills to NY Medicaid. These patients skip the
      benefit check entirely — they go straight to the DVS stage.</p>
    </div>`;
  }else{
    const hidden=resolved.filter(isAutoFilledMedicaidSupply);
    $('prod-area').innerHTML=`
      <div class="prod-list">${visible.map(prodCard).join('')}</div>
      ${hidden.length?`
      <div class="dvs-note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span><b>${hidden.map(r=>PRODUCT_LABELS[r.product]).join(' & ')}</b> will be handled at the DVS stage.</span>
      </div>`:''}
    `;
  }

  /* Call log for this section — optional, no default row */
  $('call-log-2').innerHTML=callLogHtml('calls2',S.calls2,false);
}

/* =====================================================================
   render — monday preview + actions
   ===================================================================== */
const PRODUCT_AUTH_COLUMN={monitor:'CGM auth result',sensors:'Sensors auth result',insulin_pump:'Insulin pump auth result',infusion_set:'Infusion set auth result',cartridge:'Cartridges auth result'};
const ALL_AUTH_PRODUCTS=['monitor','sensors','insulin_pump','infusion_set','cartridge'];

function renderMonday(){
  const resolved=getResolved();
  const ready=!!P.primary&&!!P.serving;
  const cols=deriveMondayColumns(resolved);
  const nod=computeNextOrderDates();
  const nb=deriveNeverBilled();
  const missing=validateForSubmit();

  const rows=[
    {label:'Active/Network',value:cols.activeNetwork},
    {label:'DME Benefits',value:cols.dmeBenefits},
    {label:'Auth',value:cols.auth},
    {label:'SoS',value:cols.sos},
    {label:'Not Clear Products',value:cols.notClearProducts},
    {label:'Skip SoS Products',value:cols.skipSosProducts},
    {label:'Stage Advancer',value:cols.stageAdvancer},
    {label:'Escalation',value:cols.escalation},
  ];
  if(nod.ip)rows.push({label:'IP Next Order Date',value:fmtDate(nod.ip)});
  if(nod.sensors)rows.push({label:'Sensors Next Order Date',value:fmtDate(nod.sensors)});
  if(nod.supplies)rows.push({label:'Supplies Next Order Date',value:fmtDate(nod.supplies)});
  if(nb.isCar!==null)rows.push({label:'Never billed IS/Car',value:nb.isCar});
  if(nb.cgm!==null)rows.push({label:'Never billed CGM',value:nb.cgm});
  /* Never billed pump/supplies → pump date unknown until the rep asks the
     patient later — write "TBD" to the pump-date text column (text_mm58k9x9) */
  if(nb.pumpDateTbd)rows.push({label:'Pump Date · text_mm58k9x9',value:'TBD'});

  /* product-specific auth result columns */
  const isReq=r=>isAutoFilledMedicaidSupply(r)?true:code(PID_TO_CODE[r.product]).auth==='required';
  const anyAuthRequired=resolved.some(isReq);
  const requiredSet=new Set(resolved.filter(isReq).map(r=>r.product));
  const servedSet=new Set(resolved.map(r=>r.product));
  const authRows=anyAuthRequired?ALL_AUTH_PRODUCTS.map(p=>({
    label:PRODUCT_AUTH_COLUMN[p],
    value:requiredSet.has(p)?'Required':servedSet.has(p)?'No Auth Needed':'Not Serving',
  })):[];
  const authTone=v=>v==='Required'?'warn':v==='Not Serving'?'good':'skip';

  $('mon-card').innerHTML=`
    <button type="button" class="mon-toggle ${mondayOpen?'open':''}" aria-expanded="${mondayOpen}" onclick="toggleMonday()">
      <h2 style="color:var(--mm-teal)">Monday Board Output</h2>
      <span class="mon-toggle-hint">${mondayOpen?'Hide':'Show'} what lands on the board</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    ${ready&&mondayOpen?`
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:16px">
      <div class="mon-box">
        <h3>Main columns</h3>
        <p class="msub">Each column on the Monday board gets the value below.</p>
        <div class="mon-rows">
          ${rows.map(r=>`
          <div class="mon-row">
            <span class="mlabel">${r.label}</span>
            <span class="mval ${tone(r.value)}">${r.value}</span>
          </div>`).join('')}
        </div>
        ${!cols.allFilled?'<p class="mon-note">Fill Auth + SoS for every product to compute Auth and SoS columns.</p>':''}
      </div>

      <div class="mon-box">
        <h3>Product-specific auth result columns</h3>
        <p class="msub">${anyAuthRequired?'Each of the 5 auth result columns gets the value below.':'No auths required — the auth result columns stay blank on the Monday board.'}</p>
        ${anyAuthRequired?`
        <div class="mon-rows">
          ${authRows.map(r=>`
          <div class="mon-row">
            <span class="mlabel">${r.label}</span>
            <span class="mval ${authTone(r.value)}">${r.value}</span>
          </div>`).join('')}
        </div>`:''}
      </div>
    </div>`:''}

    <div class="foot-actions">
      <div class="foot-left"></div>
      <button class="send-btn" ${missing.length?'disabled':''} onclick="toast('Benefit check complete — sent to Monday (demo)')">${icoSend} Benefit Check Complete</button>
    </div>
    ${missing.length?`
    <div class="missing-box">
      <div class="mb-title">Missing before send</div>
      <div class="mb-list">${missing.join(' · ')}</div>
    </div>`:''}
  `;
}

let mondayOpen=false;
function toggleMonday(){mondayOpen=!mondayOpen;renderMonday()}

/* =====================================================================
   modals & toast
   ===================================================================== */
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

/* =====================================================================
   clinicals dropdown
   ===================================================================== */
const CLINICALS=[
  {name:'Clinical Notes — Dr. Greenberg 05-12-2026.pdf',size:'1.2 MB'},
  {name:'CGM Script.pdf',size:'184 KB'},
  {name:'IP Script.pdf',size:'210 KB'},
];
const icoDl=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
function renderClinicals(){
  $('clin-count').textContent=CLINICALS.length;
  $('clin-dd').innerHTML=`
    ${CLINICALS.map(f=>`
    <button class="clin-file" onclick="toast('Downloading ${f.name.replace(/'/g,"\\'")} (demo)')">
      ${icoDl}
      <span class="fname" title="${f.name}">${f.name}</span>
      <span class="fsize">${f.size}</span>
    </button>`).join('')}
    <div class="clin-all">
      <button class="tbtn" style="width:100%;justify-content:center" onclick="toast('Downloading all ${CLINICALS.length} clinical files (demo)')">
        ${icoDl} Download All (${CLINICALS.length})
      </button>
    </div>`;
}
function toggleClinicals(){$('clin-dd').classList.toggle('open')}
document.addEventListener('click',e=>{
  if(!e.target.closest('.clin-wrap'))$('clin-dd').classList.remove('open');
});

/* =====================================================================
   main render
   ===================================================================== */
function renderDemoBar(){
  $('demo-seg').innerHTML=SCENARIOS.map(s=>
    `<button class="${scenario===s.key?'on':''}" onclick="setScenario('${s.key}')">${s.label}</button>`).join('');
}
function render(){
  renderDemoBar();
  renderHeader();
  renderUniversal();
  renderProducts();
  renderCallPills();
  renderMonday();
}
renderClinicals();
render();
</script>

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily baseline refresh — generated into the build artifact, never committed.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must not cancel each other mid-publish: cancelling a
# deploy-pages job in flight orphans a Pages deployment that keeps holding the
# environment lock, wedging every later deploy. Queue them instead (GitHub's
# own recommended setting for Pages).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # ── Regression gates (Brandon, 2026-07-29): the deploy is blocked
      # unless typecheck and the full unit suite pass. Semantic changes
      # to the suggestion engine additionally require the corpus replay —
      # see REGRESSION.md. ──
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Generate baseline snapshot (into build artifact, not committed)
        env:
          MONDAY_API_TOKEN: ${{ secrets.VITE_MONDAY_API_TOKEN }}
        run: node scripts/snapshot-baseline.mjs

      - name: Build
        env:
          VITE_MONDAY_API_TOKEN: ${{ secrets.VITE_MONDAY_API_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # RingCentral (SMS/fax) — set these Actions secrets to use the new
          # RC app without committing its credentials; unset falls back to the
          # bundled legacy-app values in lib/fax/ringcentralApi.ts. Remember:
          # secrets do NOT carry over on Sync from Test Repo (CLAUDE.md §8).
          VITE_RC_CLIENT_ID: ${{ secrets.VITE_RC_CLIENT_ID }}
          VITE_RC_CLIENT_SECRET: ${{ secrets.VITE_RC_CLIENT_SECRET }}
          VITE_RC_JWT: ${{ secrets.VITE_RC_JWT }}
          VITE_RC_SMS_FROM: ${{ secrets.VITE_RC_SMS_FROM }}
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Copy 404
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

name: Daily Baseline Snapshot
on:
  schedule:
    # Run at 07:00 and 08:00 UTC to cover both EDT (UTC-4) and EST (UTC-5)
    # Targets 3 AM Eastern — even with GH Actions delay, fires well before 9 AM
    # The script itself checks for today's date and no-ops if already snapshotted
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Manual trigger for testing
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate baseline snapshot
        env:
          MONDAY_API_TOKEN: ${{ secrets.VITE_MONDAY_API_TOKEN }}
        run: node scripts/snapshot-baseline.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/baseline.json
          if git diff --cached --quiet; then
            echo "No changes to baseline — skipping commit"
          else
            DATE=$(TZ=America/New_York date +%Y-%m-%d)
            git commit -m "chore: daily baseline snapshot ${DATE}"
            git push
          fi

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Outstanding · Redesign</title>
<style>
/* ============ design tokens (Medical Evaluation UI Design v2) ============ */
:root{
  --background:oklch(1 0 0);
  --foreground:oklch(0.129 0.042 264.695);
  --card:oklch(1 0 0);
  --muted:oklch(0.968 0.007 247.896);
  --muted-foreground:oklch(0.554 0.046 257.417);
  --border:oklch(0.929 0.013 255.508);
  --input:oklch(0.929 0.013 255.508);
  /* Medically Modern palette */
  --mm-teal:oklch(0.36 0.04 200);
  --mm-green:oklch(0.62 0.10 175);
  --mm-green-12:oklch(0.62 0.10 175 / 0.12);
  --mm-mint:oklch(0.94 0.02 175);
  --mm-mint-ring:oklch(0.85 0.04 175);
  --mm-rose:oklch(0.62 0.13 18);
  --mm-rose-soft:oklch(0.94 0.03 18);
  --mm-amber:oklch(0.66 0.12 75);
  --mm-amber-soft:oklch(0.96 0.04 90);
  --mm-sky:oklch(0.60 0.10 230);
  --mm-sky-soft:oklch(0.95 0.02 230);
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--background);color:var(--foreground);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
.page{max-width:120rem;margin:0 auto;padding:40px 32px;display:flex;flex-direction:column;gap:24px}

/* ============ cards ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.step-card{border-left:4px solid var(--mm-green)}
.header-card{border-top:4px solid var(--mm-teal)}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.step-num{
  display:grid;place-items:center;height:36px;width:36px;border-radius:50%;
  font-size:1rem;font-weight:700;background:var(--mm-green-12);color:var(--mm-teal);
  box-shadow:inset 0 0 0 1px var(--mm-mint-ring);flex-shrink:0;
}
.step-num.done{background:var(--mm-green);color:#fff;box-shadow:none}
.step-head h2{font-size:1.25rem;font-weight:700;letter-spacing:-.015em}
.ctx-title{font-size:1.05rem!important;color:var(--mm-teal)}
.step-sub{font-size:.9rem;color:var(--muted-foreground);margin:0 0 20px 48px}
.step-chip{margin-left:auto;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--muted);color:var(--muted-foreground)}
.step-chip.ok{background:var(--mm-mint);color:var(--mm-teal)}

/* ============ typography helpers ============ */
.eyebrow{font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.hval,.sval,.ph-name,.sel{user-select:all;-webkit-user-select:all}
.eyebrow-xs{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.demo-tag{
  display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;
  font-size:.62rem;font-weight:700;letter-spacing:.05em;vertical-align:middle;
  background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3);
}
.hval{margin-top:4px;font-size:1.125rem;font-weight:600}

/* ============ top bar ============ */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:1.875rem;font-weight:900;letter-spacing:-.025em;color:var(--mm-teal)}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:9px 16px;
  font-size:.875rem;font-weight:600;border:1px solid var(--border);background:var(--card);
  color:var(--mm-teal);box-shadow:0 1px 2px rgb(0 0 0 / .05);transition:all .12s;
}
.tbtn:hover{border-color:var(--mm-mint-ring);background:oklch(0.973 0.011 175)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}

/* ============ demo bar ============ */
.demo-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-bottom:-8px;flex-wrap:wrap}
.demo-bar .lbl{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.demo-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;background:oklch(0.968 0.007 247.896 / 0.4);flex-wrap:wrap}
.demo-seg button{font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:6px;color:var(--muted-foreground)}
.demo-seg button.on{background:var(--card);color:var(--mm-teal);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.reset-link{font-size:.8rem;font-weight:600;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:3px}
.reset-link:hover{color:var(--foreground)}

/* ============ patient header ============ */
.ph-name{font-size:1.875rem;font-weight:900;letter-spacing:-.025em}
.ph-dob{margin-top:4px;font-size:1.125rem;color:var(--muted-foreground)}
.ph-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.hgroup{border:1px solid var(--border);border-radius:12px;background:oklch(0.968 0.007 247.896 / 0.3);padding:16px}
.hgroup .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.ph-groups .eyebrow{font-size:.78rem;white-space:nowrap;display:flex;align-items:center;gap:6px;height:18px}
.ph-groups .hval{margin-top:6px;min-height:38px;display:flex;align-items:center}
.ph-toggle{
  margin-top:20px;display:inline-flex;align-items:center;gap:6px;
  font-size:1.125rem;font-weight:600;color:var(--mm-teal);
}
.ph-toggle:hover{opacity:.8}
.ph-toggle svg{transition:transform .2s}
.ph-toggle.open svg{transform:rotate(180deg)}
.ph-details{margin-top:20px;border-top:1px solid var(--border);padding-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* ============ stedi check output (read-only) ============ */
.stedi-block{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:16px;background:oklch(0.968 0.007 247.896 / 0.2)}
.stedi-head{margin-bottom:12px}
.stedi-grid{display:grid;gap:10px}
.stedi-grid+.stedi-grid{margin-top:10px}
.stedi-grid.three{grid-template-columns:repeat(3,1fr)}
.sbox{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px 14px}
.sval{margin-top:2px;font-size:.95rem;font-weight:500}
.sval.strong{font-weight:700}
@media (max-width:1150px){
  .stedi-grid.three{grid-template-columns:repeat(2,1fr)}
}

select,input[type=date],input[type=text],input[type=number],textarea{
  font:inherit;font-size:.875rem;width:100%;height:38px;padding:0 12px;
  border:1px solid var(--input);border-radius:6px;background:var(--background);color:var(--foreground);
}
textarea{height:auto;padding:10px 12px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--mm-green);outline-offset:1px}
.flabel{margin-bottom:6px;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-foreground)}
.fhint{margin-top:6px;font-size:.75rem;color:var(--muted-foreground)}
.req-star{color:var(--mm-rose);font-weight:700}

/* ============ segmented buttons ============ */
.seg{display:inline-flex;width:100%;gap:8px;margin-top:8px}
.seg button{
  flex:1;padding:10px 12px;font-size:.875rem;font-weight:600;border-radius:6px;
  border:2px solid var(--border);background:var(--background);color:var(--muted-foreground);
  transition:all .12s;
}
.seg button.g:not(.sel-g):hover{color:var(--mm-green);border-color:var(--mm-green);background:var(--mm-green-12)}
.seg button.sel-g{border-color:transparent;background:var(--mm-green);color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

.prod-code-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mod-dot{font-size:1.1rem;font-weight:700;color:var(--muted-foreground);opacity:.6}
.mod-chip{
  display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;font-weight:700;
  background:var(--muted);color:var(--foreground);box-shadow:inset 0 0 0 1px var(--border);
  user-select:all;-webkit-user-select:all;
}

/* ============ split: submission recap (left) · result entry (right) ============
   Mirrors the Profile Send-Off duo: teal-tinted "received" panel vs white
   green-accented "work" panel. */
.prod-split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;margin-top:16px;align-items:stretch}
.split-head{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;
  color:var(--mm-teal);padding:10px 14px;border-bottom:1px solid var(--border);
}
.sub-panel{
  border:1px solid var(--border);border-top:4px solid var(--mm-teal);border-radius:12px;
  background:oklch(0.985 0.005 200);overflow:hidden;
  display:flex;flex-direction:column;
}
.sub-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.sub-panel .sbox{background:var(--card)}
.sub-panel .sval{font-size:.9rem}
.sub-empty{font-size:.82rem;color:var(--muted-foreground);line-height:1.5}
.work-panel{
  border:1px solid var(--border);border-left:4px solid var(--mm-green);border-radius:12px;
  background:var(--card);overflow:hidden;display:flex;flex-direction:column;min-width:0;
}
.work-panel .split-head{background:oklch(0.968 0.007 247.896 / 0.4)}
.work-body{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.work-body>.flabel{color:var(--mm-teal);font-weight:700}
/* result detail zone keeps one height across Auth Valid / Denied / No Auth Needed */
/* min-height is set at runtime per card = its tallest possible state,
   so the card ends flush below its tallest content — no fixed px filler */
.res-detail{min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
@media (max-width:960px){.prod-split{grid-template-columns:1fr}}

/* ============ result segmented (3 tones) ============ */
.res-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.res-seg button{
  padding:10px 8px;font-size:.875rem;font-weight:600;border-radius:6px;white-space:nowrap;
  border:2px solid var(--border);background:var(--background);color:var(--muted-foreground);transition:all .12s;
}
.res-seg button.g:not(.on):hover{color:var(--mm-green);border-color:var(--mm-green);background:var(--mm-green-12)}
.res-seg button.r:not(.on):hover{color:var(--mm-rose);border-color:var(--mm-rose);background:oklch(0.62 0.13 18 / 0.12)}
.res-seg button.s:not(.on):hover{color:var(--mm-sky);border-color:var(--mm-sky);background:var(--mm-sky-soft)}
.res-seg button.g.on{border-color:transparent;background:var(--mm-green);color:#fff}
.res-seg button.r.on{border-color:transparent;background:var(--mm-rose);color:#fff}
.res-seg button.s.on{border-color:transparent;background:var(--mm-sky);color:#fff}

/* ============ denial upload ============ */
.deny-upload{
  margin-top:14px;border:2px dashed oklch(0.62 0.13 18 / 0.45);border-radius:10px;
  background:oklch(0.94 0.03 18 / 0.35);padding:18px 16px;text-align:center;
}
.deny-upload .du-title{font-size:.9rem;font-weight:700;color:var(--mm-rose)}
.deny-upload .du-sub{margin-top:2px;font-size:.78rem;color:var(--muted-foreground)}
.deny-btn{
  margin-top:10px;display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 16px;
  font-size:.85rem;font-weight:600;background:var(--mm-rose);color:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .1);
}
.deny-btn:hover{background:oklch(0.56 0.13 18)}
.deny-file{
  display:inline-flex;align-items:center;gap:8px;max-width:100%;
  padding:7px 14px;border-radius:8px;background:var(--card);
  box-shadow:inset 0 0 0 1px oklch(0.62 0.13 18 / 0.35);
  font-size:.85rem;font-weight:600;color:var(--mm-rose);
}
.deny-file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deny-swap{font-size:.78rem;font-weight:600;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:3px;margin-top:8px}
.deny-swap:hover{color:var(--foreground)}

/* ============ SoS recheck entry (benefits pattern) ============ */
.recheck{
  margin-top:12px;border:1px solid oklch(0.60 0.10 230 / 0.4);border-radius:10px;
  background:oklch(0.95 0.02 230 / 0.45);padding:10px 14px 12px;
}
.recheck .flabel{color:var(--mm-sky)}
.recheck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.recheck-head .flabel{margin-bottom:0}
.nan-save{
  display:inline-flex;align-items:center;gap:7px;flex-shrink:0;border-radius:8px;padding:7px 14px;
  font-size:.82rem;font-weight:600;background:var(--mm-sky);color:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .1);
  position:relative;top:-3px;
}
.nan-save:hover{background:oklch(0.54 0.10 230)}

/* call/fax submissions have no portal paper trail — drag & drop the docs.
   Compact row layout so the card stays short. */
.authdoc-drop{
  margin-top:12px;
  display:flex;align-items:center;gap:12px;
  border:2px dashed oklch(0.66 0.12 75 / 0.5);border-radius:10px;
  background:oklch(0.96 0.04 90 / 0.45);padding:9px 14px;text-align:left;
  cursor:pointer;transition:all .12s;
}
.authdoc-drop:hover,.authdoc-drop.drag{border-color:var(--mm-amber);background:oklch(0.96 0.04 90 / 0.85)}
.authdoc-drop svg{color:var(--mm-amber);flex-shrink:0}
.authdoc-drop .adt{font-size:.88rem;font-weight:700;color:oklch(0.46 0.10 75)}
.authdoc-drop .ads{font-size:.76rem;color:var(--muted-foreground)}
.authdoc-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.authdoc-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  background:var(--card);box-shadow:inset 0 0 0 1px oklch(0.66 0.12 75 / 0.4);
  font-size:.78rem;font-weight:600;color:oklch(0.46 0.10 75);max-width:100%;
}
.authdoc-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sos-grid{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.sos-pair{
  flex:1;display:grid;grid-template-columns:minmax(140px,1fr) 90px;gap:10px;
  border:1.5px dashed var(--border);border-radius:10px;background:var(--card);padding:10px 12px;
}
.sos-pair.locked{opacity:.5}
.slab{margin-bottom:5px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-foreground);white-space:nowrap}
.sos-grid input:disabled{cursor:not-allowed;background:var(--muted)}
.sos-or{
  display:grid;place-items:center;height:30px;width:30px;border-radius:50%;flex-shrink:0;
  background:var(--muted);font-size:.68rem;font-weight:800;color:var(--muted-foreground);letter-spacing:.02em;
  margin-bottom:14px;
}
.sos-toggle{
  height:38px;padding:0 14px;font-size:.85rem;font-weight:600;border-radius:6px;margin-bottom:10px;
  border:2px solid var(--border);background:var(--background);color:var(--muted-foreground);transition:all .12s;white-space:nowrap;
}
.sos-toggle:not(.on):hover{color:var(--mm-sky);border-color:var(--mm-sky);background:var(--mm-sky-soft)}
.sos-toggle.on{border-color:transparent;background:var(--mm-sky);color:#fff}

/* ============ DVS / claims box ============ */
.dvs-status{
  margin-top:16px;border:1px solid oklch(0.60 0.10 230 / 0.35);border-radius:12px;
  background:oklch(0.95 0.02 230 / 0.5);padding:16px 18px;
}
.dvs-status .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dvs-status .ttl{font-size:.95rem;font-weight:700;color:var(--mm-sky)}
.dvs-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--card);box-shadow:inset 0 0 0 1px var(--border);color:var(--muted-foreground)}
.dvs-chip.ok{color:var(--mm-teal);box-shadow:inset 0 0 0 1px var(--mm-mint-ring);background:var(--mm-mint)}
.dvs-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:9px 16px;
  font-size:.85rem;font-weight:600;background:var(--mm-green);color:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .1);
}
.dvs-btn:hover{background:oklch(0.56 0.10 175)}
.dvs-done{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--mm-teal)}
.dvs-sub{margin-top:8px;font-size:.82rem;color:var(--mm-sky)}

/* matrix: Submitted = light blue → "check this one today" */
.mtx-cell.sub{border-color:oklch(0.60 0.10 230 / 0.5);background:oklch(0.95 0.02 230 / 0.7)}
.mtx-pill.sub{background:oklch(0.60 0.10 230 / 0.12);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.4)}

/* ============ auth status matrix (read-only, from Monday) ============ */
.mtx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.mtx-cell{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px}
.mtx-cell.req{border-color:oklch(0.66 0.12 75 / 0.5);background:oklch(0.96 0.04 90 / 0.4)}
/* matrix: No Auth Needed / already-resolved = grayed out → nothing to do here */
.mtx-cell.ok{border-color:var(--border);background:oklch(0.968 0.007 247.896 / 0.4);opacity:.65}
.mtx-cell.ok .mtx-code{color:var(--muted-foreground)}
.mtx-cell.na{opacity:.55}
.mtx-code{font-size:1.05rem;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mm-teal);letter-spacing:-.01em}
.mtx-cell.na .mtx-code{color:var(--muted-foreground)}
.mtx-name{font-size:.78rem;font-weight:600;color:var(--muted-foreground);margin-top:1px}
.mtx-pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;margin-top:auto}
.mtx-pill.req{background:var(--mm-amber-soft);color:oklch(0.5 0.11 75);box-shadow:inset 0 0 0 1px oklch(0.66 0.12 75 / 0.35)}
.mtx-pill.ok{background:var(--muted);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.mtx-pill.na{background:var(--muted);color:var(--muted-foreground)}
/* DVS Required = gray, no action on THIS view (DVS gets its own view next).
   A touch darker than Not Serving so it still reads as a real status. */
.mtx-cell.dvs{border-color:var(--border);background:oklch(0.968 0.007 247.896 / 0.55);opacity:.8}
.mtx-cell.dvs .mtx-code{color:var(--muted-foreground)}
.mtx-pill.dvs{background:var(--muted);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.chip.mcd{background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3)}
@media (max-width:1150px){.mtx-grid{grid-template-columns:repeat(2,1fr)}}

/* ============ product cards ============ */
.prod-list{display:flex;flex-direction:column;gap:16px}
.prod-card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px 24px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prod-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.chip.rec{background:var(--mm-green-12);color:var(--mm-teal)}
.chip.one{background:var(--muted);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.chip.grp{background:transparent;color:var(--muted-foreground);padding:3px 2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.pending{background:var(--muted);color:var(--muted-foreground)}
.pill.clear{background:var(--mm-mint);color:var(--mm-teal);box-shadow:inset 0 0 0 1px var(--mm-mint-ring)}
.pill.skip{background:var(--mm-sky-soft);color:var(--mm-sky);box-shadow:inset 0 0 0 1px oklch(0.60 0.10 230 / 0.3)}
.pill.rose{background:var(--mm-rose-soft);color:var(--mm-rose);box-shadow:inset 0 0 0 1px oklch(0.62 0.13 18 / 0.3)}

<body>
<div class="page">

<script>
/* =====================================================================
   LOGIC PORT — mirrors src/pages/AuthOutstandingPage.tsx +
   src/components/samantha/AuthOutstandingPanel.tsx and the
   authOutstanding branch of lib/samantha/mondayWrite.ts.
   SoS recheck follows the NEW Benefits model: the rep records facts
   (last bill date + units, or No Billing History); clear/not-clear is
   DERIVED, never shown. UI-only: nothing here talks to Monday.
   ===================================================================== */

/* ---------- hcpcRules.ts ---------- */
const MONITOR_HCPC='E2103', SENSORS_HCPC='A4239', PUMP_HCPC='E0784';
const SUPPLY_GROUPS={
  A:{infusion_set:'A4230',cartridge:'A4232'},
  B:{infusion_set:'A4224',cartridge:'A4225'},
  C:{infusion_set:'A4231',cartridge:'A4232'},
};
const GROUP_BY_PAYER={
  'Fidelis Medicaid':'A','Fidelis Low-Cost':'A','Fidelis Commercial':'A',
  'Anthem BCBS Commercial':'A','Anthem BCBS Medicaid (JLJ)':'A','Anthem BCBS Low-Cost (JLJ)':'A',
  'United Medicaid':'A','United Commercial':'A','United Low-Cost':'A',
  'Horizon BCBS':'A','BCBS TN':'A','BCBS FL':'A','BCBS WY':'A',

const isoDate=d=>{const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const todayIso=()=>isoDate(new Date());
const tomorrowIso=()=>{const d=new Date();d.setDate(d.getDate()+1);return isoDate(d)};
function daysSince(iso){
  if(!iso)return 0;
  const ms=new Date(todayIso()+'T00:00:00').getTime()-new Date(iso+'T00:00:00').getTime();
  return Math.max(0,Math.round(ms/86400000));
}

function earliestSubDate(sc){

}

/* SoS lookback — 4 yr pump & monitor; 90 days others (60 with Medicaid) */
function patientHasMedicaid(){
  return (P.primary??'').toLowerCase().includes('medicaid')||
    ((P.secondary==='None'?'':P.secondary)??'').toLowerCase().includes('medicaid');
}
function sosLookbackDays(codeId){
  if(codeId==='pump'||codeId==='cgm-monitor')return 365*4;
  return patientHasMedicaid()?60:90;
}
function sosClearBeforeIso(codeId){
  const d=new Date();d.setDate(d.getDate()-sosLookbackDays(codeId));
  return d.toISOString().slice(0,10);
}
function nextOrderOffsetDays(codeId){
  if(codeId==='pump')return 365*4;
  if(codeId==='cgm-sensors')return 90;
  if(codeId==='infusion-sets'||codeId==='cartridges')return patientHasMedicaid()?60:90;
  return null;
}
function addDaysToDate(dateStr,days){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime()))return'';
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtDate(s){
  if(!s)return'—';
  const d=new Date(s+'T00:00:00');
  if(isNaN(d.getTime()))return'—';
  return d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});
}
/* Derived recheck SoS — never shown to the rep; drawer only. */
function recheckComplete(codeId){
  const s=code(codeId);
  return s.never||(!!s.lastBill&&!!s.units);
}
function derivedRecheckSos(codeId){
  const s=code(codeId);
  if(s.never)return 'clear';
  if(s.lastBill)return s.lastBill<sosClearBeforeIso(codeId)?'clear':'not-clear';
  return '';
}

function cardComplete(codeId){
  const s=code(codeId);
  if(!s.result)return false;
  if(s.result==='auth-valid')return !!s.authId&&!!s.authStart&&!!s.authEnd&&!!s.authUnits;
  if(s.result==='no-auth-needed')return recheckComplete(codeId);
  return true; /* denied — nothing more required here */
}
function validateForSubmit(){
  const missing=[];
  for(const r of getTracked()){
    const cid=PID_TO_CODE[r.product];
    const s=code(cid);
    if(!s.result){missing.push(`${r.hcpc} · Auth Result`);continue;}
    if(s.result==='auth-valid'){
      if(!s.authId)missing.push(`${r.hcpc} · Auth ID`);
      if(!s.authStart)missing.push(`${r.hcpc} · Auth Start`);
      if(!s.authEnd)missing.push(`${r.hcpc} · Auth End`);
      if(!s.authUnits)missing.push(`${r.hcpc} · Units`);
    }
    if(s.result==='no-auth-needed'&&!recheckComplete(cid)){
      missing.push(`${r.hcpc} · SoS recheck (Last Bill Date + Units, or No Billing History)`);
    }
  }
  return missing;
}
/* Stage rules (mondayWrite authOutstanding):
   any denied → Auth Denied + Escalation Required;
   all resolved → Complete (DVS supplies must be marked via Claims Paid);
   otherwise leave the stage alone. */
function anyDenied(){return getTracked().some(r=>code(PID_TO_CODE[r.product]).result==='denied')}
function allResolved(){
  const tracked=getTracked();
  const cardsResolved=tracked.length>0
    ? tracked.every(r=>{const s=code(PID_TO_CODE[r.product]);return s.result==='auth-valid'||s.result==='no-auth-needed'})
    : true;
  /* DVS-routed products don't gate this page — they resolve at the DVS stage */
  return tracked.length>0&&cardsResolved;
}

/* Height rule (Brandon): a card is exactly as tall as its TALLEST possible
   state — it ends flush right below the upload box, no filler. Measured at
   runtime per card + viewport instead of hard-coded pixels, so it stays
   tight at any window width. */
function equalizeHeights(){
  const byCode={};
  getTracked().forEach(r=>byCode[PID_TO_CODE[r.product]]=r);
  document.querySelectorAll('.res-detail[data-code]').forEach(det=>{
    const codeId=det.dataset.code, r=byCode[codeId];
    if(!r)return;
    det.style.minHeight='0px';
    const w=det.clientWidth;
    if(!w)return;
    const sb=document.createElement('div');
    sb.className='res-detail';
    sb.style.cssText=`position:absolute;visibility:hidden;left:-9999px;top:0;width:${w}px;min-height:0`;
    document.body.appendChild(sb);
    const base=code(codeId);
    const variants=[
      {...base,result:'auth-valid'},
      {...base,result:'denied'},
      {...base,result:'no-auth-needed',never:false,lastBill:base.lastBill||'2026-01-01',units:base.units||'1'},
    ];
    let max=0;
    for(const v of variants){
      sb.innerHTML=resDetailHTML(r,codeId,v);
      max=Math.max(max,sb.offsetHeight);
    }
    sb.remove();
    det.style.minHeight=max+'px';
  });
}
let eqTimer;
window.addEventListener('resize',()=>{clearTimeout(eqTimer);eqTimer=setTimeout(equalizeHeights,150)});
function denialUpload(codeId,input){
  const f=input.files&&input.files[0];
  if(f){setCode(codeId,{denialFile:f.name});toast(`${f.name} uploaded to Final Clinicals as the denial reason (demo)`)}
  input.value='';
}
/* auth-doc drag & drop → Monday Final Clinicals file column (file_mm25m8c1) */
function adFiles(codeId,files){
  if(!files||!files.length)return;
  const names=[...files].map(f=>f.name);
  setCode(codeId,{authDocs:[...(code(codeId).authDocs||[]),...names]});
  toast(`${names.length} file${names.length>1?'s':''} uploaded to Final Clinicals (demo)`);
}
function adDrop(e,codeId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  adFiles(codeId,e.dataTransfer.files);
}

function renderMonday(){
  const tracked=getTracked();
  const missing=validateForSubmit();
  const denied=anyDenied();
  const resolved=allResolved()&&missing.length===0;

  const stage=denied?'Auth Denied':resolved?'Complete':'— (unchanged)';
  const stageTone=denied?'bad':resolved?'good':'neutral';
  const escal=denied?'Escalation Required':'Done';

  const rows=[
    {label:'Stage Advancer',value:stage,tone:stageTone},
    {label:'Escalation',value:escal,tone:escal==='Done'?'good':'bad'},
    /* daily-bucket plumbing: Submit Auth stamped Follow Up = same-day;
       "Auth Still Outstanding" pushes it +1 day */
    {label:'Follow Up Date · date_mm34m2dz',
     value:fmtDate(FOLLOWUP[scenario])+(isCleared(scenario)?' — tomorrow (Still Outstanding)':' — today'),
     tone:isCleared(scenario)?'skip':'neutral'},
    /* NEW Monday column ask: days since auth submission, kept counting by
       the backend (usable later as a filter / trigger) */
    {label:'Days Auth Outstanding · NEW column',
     value:`${daysOutstanding(SC)} days (since ${fmtDate(earliestSubDate(SC))})`,tone:'warn'},
  ];

  const prodRows=[];
  for(const r of tracked){
    const cid=PID_TO_CODE[r.product];
    const s=code(cid);
    prodRows.push({head:`${r.hcpc} · ${PRODUCT_LABELS[r.product]}`});
    prodRows.push({label:PRODUCT_AUTH_COLUMN[r.product],value:RESULT_LABEL[s.result],
      tone:s.result==='auth-valid'?'good':s.result==='denied'?'bad':s.result==='no-auth-needed'?'skip':'neutral'});

      prodRows.push({label:'Auth ID',value:s.authId||'—',tone:'neutral'});
      prodRows.push({label:'Auth Start',value:fmtDate(s.authStart),tone:'neutral'});
      prodRows.push({label:'Auth End',value:fmtDate(s.authEnd),tone:'neutral'});
      prodRows.push({label:'Units',value:s.authUnits||'—',tone:'neutral'});
    }
    if(s.result==='denied'){
      prodRows.push({label:'Denial Reason (file)',value:s.denialFile||'— not uploaded',tone:s.denialFile?'good':'warn'});
    }
    if(s.result==='no-auth-needed'){
      const sos=derivedRecheckSos(cid);
      prodRows.push({label:'SoS (recheck, derived)',
        value:sos==='clear'?'Clear':sos==='not-clear'?'Not Clear':'— pending recheck call',
        tone:sos==='clear'?'good':sos==='not-clear'?'warn':'warn'});
      const offset=nextOrderOffsetDays(cid);
      if(s.lastBill&&offset)prodRows.push({label:'Next Order Date',value:fmtDate(addDaysToDate(s.lastBill,offset)),tone:'neutral'});

    </button>

    ${mondayOpen?`
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:16px">
      <div class="mon-box">
        <h3>Main columns</h3>
        <p class="msub">Any denial → Auth Denied + Escalation Required. Every product fully resolved → Complete. Partial (e.g. a saved No Auth Needed awaiting its recheck) → the stage is left alone.</p>

        <p class="msub">Auth results, approval details, and the derived SoS recheck land in their per-product columns.</p>

  `;
}

    <div class="missing-box">
      <div class="mb-title">Needed before Auth Review Complete</div>
      <div class="mb-list">${missing.join(' · ')}</div>
    </div>`:''}
  `;
}

/* =====================================================================
   toast + clinicals + final clinicals upload
   ===================================================================== */
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}
const CLINICALS=[
  {name:'Clinical Notes — Dr. Greenberg 05-12-2026.pdf',size:'1.2 MB'},
  {name:'CGM Script.pdf',size:'184 KB'},
  {name:'IP Script.pdf',size:'210 KB'},
];
const icoDl=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
function renderClinicals(){
  $('clin-count').textContent=CLINICALS.length;
  $('clin-dd').innerHTML=`
    ${CLINICALS.map(f=>`
    <button class="clin-file" onclick="toast('Downloading ${f.name.replace(/'/g,"\\'")} (demo)')">
      ${icoDl}
      <span class="fname" title="${f.name}">${f.name}</span>
      <span class="fsize">${f.size}</span>
    </button>`).join('')}
    <div class="clin-all">
      <button class="tbtn" style="width:100%;justify-content:center" onclick="toast('Downloading all ${CLINICALS.length} clinical files (demo)')">
        ${icoDl} Download All (${CLINICALS.length})
      </button>
    </div>`;
}
function toggleClinicals(){$('clin-dd').classList.toggle('open')}
document.addEventListener('click',e=>{
  if(!e.target.closest('.clin-wrap'))$('clin-dd').classList.remove('open');
});

/* =====================================================================
   main render
   ===================================================================== */
/* ---------- patients rail: Command Center sidebar format ----------
   Payer groups (collapsible, alphabetical — mirrors groupByInsurance in
   PatientsSidebar.tsx). Due = follow-up today or earlier. Patients pushed
   to tomorrow land in a blue "Follow Up" section, exactly like the app. */
const icoUser=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
const icoChev=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const icoClockSm=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const GROUP_OPEN={};
function toggleGroup(g){GROUP_OPEN[g]=!(GROUP_OPEN[g]??true);renderRail()}
function patRow(s){
  const d=daysOutstanding(s);
  const cls=d>=14?'hot':d>=7?'warn':'ok';
  return `
  <button class="pat-row ${scenario===s.key?'on':''}" onclick="setScenario('${s.key}')">
    ${icoUser}
    <div class="pmain">
      <div class="pname">${s.name}</div>
      <div class="psub">${s.serving}</div>
      <div class="pdays ${cls}">${d} days outstanding</div>
    </div>
  </button>`;
}
function fuRow(s){
  return `
  <button class="pat-row fu ${scenario===s.key?'on':''}" onclick="setScenario('${s.key}')">
    ${icoClockSm}
    <div class="pmain">
      <div class="pname">${s.name}</div>
      <div class="psub">Until ${fmtDate(FOLLOWUP[s.key])}</div>
    </div>
  </button>`;
}
function renderRail(){
  const q=($('pat-q')?.value||'').trim().toLowerCase();
  const inStage=SCENARIOS.filter(s=>!RESOLVED.has(s.key))
    .filter(s=>!q||s.name.toLowerCase().includes(q));
  const due=inStage.filter(s=>!isCleared(s.key));
  const cleared=inStage.filter(s=>isCleared(s.key));
  const groups=new Map();
  due.forEach(s=>{const k=s.primary||'Unknown';groups.set(k,[...(groups.get(k)||[]),s])});
  const sorted=[...groups.entries()].sort(([a],[b])=>a.localeCompare(b));
  $('pat-count').textContent=`Patients (${due.length})`;
  $('pat-list').innerHTML=`
    ${sorted.map(([payer,list])=>{
      const open=GROUP_OPEN[payer]??true;
      return `
      <div>
        <button class="pat-glabel ${open?'':'closed'}" onclick="toggleGroup('${payer.replace(/'/g,"\\'")}')">
          ${icoChev}<span>${payer} (${list.length})</span>
        </button>
        ${open?list.map(patRow).join(''):''}
      </div>`;
    }).join('')||'<p class="pat-empty">Bucket clear — nothing due today.</p>'}
    ${cleared.length?`
    <div>
      <div class="pat-glabel fu">${icoClockSm}<span>Follow Up (${cleared.length})</span></div>
      ${cleared.map(fuRow).join('')}
    </div>`:''}`;
}
function render(){
  renderRail();
  renderHeader();
  renderMatrix();
  renderProducts();
  renderMonday();
  renderActions();
  equalizeHeights();
}
seedCodes();
renderClinicals();
render();
</script>
